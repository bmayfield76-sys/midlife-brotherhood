<!-- FALLBACK: use only if the single-paste version loses its styling (editor strips <style>).
     Everything is inline. No hover states or phone breakpoints in this version. -->
<div class="req-dasboard-maincontainer req-dasboard-itdesk-container" id="upper-part-ssp" style="position:relative;overflow:hidden;box-sizing:border-box;width:100%;min-height:560px;margin:0;padding:56px 24px 72px;background-color:#1B365D;background-image:linear-gradient(135deg,#1B365D 0%,#16305A 55%,#102A52 100%);border-top:5px solid #C99700;border-radius:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <div aria-hidden="true" style="position:absolute;right:-90px;top:50%;width:640px;height:640px;transform:translateY(-50%);background-image:url(/app/itdesk/api/v3/ssp_background_images/273837000000728002/_images/88004);background-repeat:no-repeat;background-position:center;background-size:contain;opacity:0.11;pointer-events:none;z-index:0;"></div>

    <div style="position:relative;z-index:1;text-align:center;margin:0 auto 36px;max-width:760px;">
        <div role="img" aria-label="Commissioner" style="width:100%;max-width:560px;height:120px;margin:0 auto;background-image:url(/app/itdesk/api/v3/ssp_background_images/273837000000728002/_images/88004);background-repeat:no-repeat;background-position:center;background-size:contain;"></div>
        <div aria-hidden="true" style="width:72px;height:3px;margin:18px auto 12px;background:#C99700;border-radius:2px;"></div>
        <p style="margin:0;color:#FFFFFF;opacity:0.85;font-size:15px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;">IT Help Desk</p>
    </div>

    <div class="search-req-dashboard" id="search-req-dashboard_dummy" style="position:relative;z-index:1;max-width:720px;margin:0 auto 40px;padding:0;float:none;">
        <div class="sdpod-input-wrapper req-dashboard-mainsearch" style="width:100%;margin:0;">
            <input input-action="search" class="sdpod-input-large" data-clickable="true" tabindex="0" placeholder="{{{ssp-search-placeholder}}}" style="box-sizing:border-box;width:100%;height:54px;padding:0 22px;border:2px solid rgba(255,255,255,0.25);border-radius:999px;background:#FFFFFF;color:#1B365D;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,0.25);outline:none;"/>
        </div>
    </div>

    <div class="req-dashboard-innerwrapper" style="position:relative;z-index:1;display:flex;justify-content:center;width:100%;max-width:720px;margin:0 auto;padding:0;">
        <div class="req-dashboard-card-wrapper request-service-box" style="width:100%;max-width:720px;margin:0;padding:0;float:none;">
            <div class="req-dashboard-card req-new" style="display:flex;align-items:center;gap:28px;box-sizing:border-box;width:100%;height:auto;min-height:0;margin:0;padding:36px 40px;background:#FFFFFF;border:0;border-left:6px solid #C99700;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,0.30);">
                <div aria-hidden="true" style="flex:0 0 auto;width:84px;height:84px;margin:0;border-radius:50%;background:#1B365D;border:3px solid #C99700;display:flex;align-items:center;justify-content:center;color:#C99700;font-size:52px;font-weight:700;line-height:1;">+</div>
                <div class="req-dashboard-innercontent" style="flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:0;margin:0;width:auto;">
                    <span class="req-dashboard-inner-head" style="display:block;color:#C99700;font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;margin:0 0 6px;">
                        {{{ssp-i-need-something}}}
                    </span>
                    <span class="req-dashboard-inner-h2" style="display:block;color:#1B365D;font-size:40px;font-weight:800;line-height:1.05;margin:0 0 18px;">
                        {{{ssp-new}}}
                    </span>
                    <span style="display:block;">
                        <button class="req-dashboard-innerbutton" click-action="load-service-templates-popup" id="create_service_btn" title="{{{ssp-request-a-service}}}" style="display:inline-block;box-sizing:border-box;min-width:220px;height:auto;padding:14px 30px;background:#1B365D;color:#FFFFFF;border:2px solid #1B365D;border-radius:999px;font-size:16px;font-weight:700;letter-spacing:0.02em;cursor:pointer;text-align:center;">
                            {{{ssp-request-a-service}}}
                        </button>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
