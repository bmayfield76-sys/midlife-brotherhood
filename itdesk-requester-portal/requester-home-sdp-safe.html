<!-- Commissioner IT Help Desk - Requester Home. SDP-SAFE VERSION (v4, compact).
     Fits inside the ~400px band SDP forces on this container. Only uses CSS the editor keeps.
     The one image URL below is the white NAME LOGO. -->
<div class="req-dasboard-maincontainer req-dasboard-itdesk-container" id="upper-part-ssp" style="display:block; box-sizing:border-box; width:100%; height:auto; min-height:0; margin:0; padding:0; background-color:#1B365D; border:0; border-radius:0; overflow:hidden">

  <div style="display:block; box-sizing:border-box; width:100%; margin:0; padding:18px 24px 22px; background-color:#1B365D; border-top:5px solid #C99700; text-align:center; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <div aria-label="Rodney Ellis, Commissioner" style="display:block; width:100%; max-width:420px; height:72px; margin:0 auto; background-image:url(/app/itdesk/api/v3/ssp_background_images/273837000000728002/_images/88004); background-repeat:no-repeat; background-position:center; background-size:contain"></div>
    <div aria-hidden="true" style="display:block; width:64px; height:3px; margin:8px auto 6px; background-color:#C99700; border-radius:2px"></div>
    <p style="display:block; margin:0 0 12px; color:#FFFFFF; opacity:0.8; font-size:12px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; line-height:1.2">IT Help Desk</p>

    <p style="display:block; margin:0 0 2px; color:#FFFFFF; font-size:22px; font-weight:700; line-height:1.2">Welcome, {{{user-username}}}</p>
    <p style="display:block; margin:0 0 14px; color:#C99700; font-size:15px; font-weight:600; line-height:1.2">How may we help you?</p>

    <div class="search-req-dashboard" id="search-req-dashboard_dummy" style="display:block; width:100%; max-width:720px; margin:0 auto 14px; padding:0; float:none">
      <div class="sdpod-input-wrapper req-dashboard-mainsearch" style="display:block; width:100%; margin:0; padding:0">
        <input input-action="search" class="sdpod-input-large" data-clickable="true" tabindex="0" placeholder="{{{ssp-search-placeholder}}}" style="display:block; box-sizing:border-box; width:100%; height:46px; margin:0; padding:0 20px; border:2px solid #FFFFFF; border-radius:999px; background-color:#FFFFFF; color:#1B365D; font-size:15px; box-shadow:0 8px 24px rgba(0,0,0,0.25); outline:none"/>
      </div>
    </div>

    <div class="req-dashboard-innerwrapper" style="display:block; width:100%; max-width:720px; margin:0 auto; padding:0; text-align:left">
      <div class="req-dashboard-card-wrapper request-service-box" style="display:block; width:100%; margin:0; padding:0; float:none">
        <div class="req-dashboard-card req-new" style="display:block; box-sizing:border-box; width:100%; height:auto; min-height:0; margin:0; padding:14px 22px 14px 18px; background-color:#FFFFFF; border:0; border-left:6px solid #C99700; border-radius:12px; box-shadow:0 14px 32px rgba(0,0,0,0.3)">
          <table style="width:100%; border-collapse:collapse; border:0; margin:0; padding:0">
            <tr>
              <td style="width:58px; padding:0 18px 0 0; vertical-align:middle; border:0">
                <div aria-hidden="true" style="display:block; box-sizing:border-box; width:58px; height:58px; margin:0; border-radius:50%; background-color:#1B365D; border:3px solid #C99700; color:#C99700; font-size:36px; font-weight:700; line-height:50px; text-align:center">+</div>
              </td>
              <td style="padding:0; vertical-align:middle; border:0">
                <div class="req-dashboard-innercontent" style="display:block; width:auto; margin:0; padding:0; text-align:left">
                  <span class="req-dashboard-inner-head" style="display:block; color:#C99700; font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; margin:0 0 2px; line-height:1.2">
                    {{{ssp-i-need-something}}}
                  </span>
                  <span class="req-dashboard-inner-h2" style="display:block; color:#1B365D; font-size:28px; font-weight:800; line-height:1.1; margin:0">
                    {{{ssp-new}}}
                  </span>
                </div>
              </td>
              <td style="padding:0 0 0 16px; vertical-align:middle; text-align:right; border:0; white-space:nowrap">
                <button class="req-dashboard-innerbutton" click-action="load-service-templates-popup" id="create_service_btn" style="display:inline-block; box-sizing:border-box; min-width:190px; height:auto; margin:0; padding:11px 26px; background-color:#1B365D; color:#FFFFFF; border:2px solid #C99700; border-radius:999px; font-size:15px; font-weight:700; letter-spacing:0.02em; cursor:pointer; text-align:center">
                  {{{ssp-request-a-service}}}
                </button>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
