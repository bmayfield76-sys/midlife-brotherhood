<!-- Commissioner IT Help Desk - Requester Home. SDP-SAFE VERSION.
     Uses only CSS that ServiceDesk Plus's editor keeps: no position, no flex alignment,
     no transforms, no gradients, no rgba borders. Layout is plain blocks + one table.
     First image URL = gold STAR (right side of the band). Second = white NAME LOGO (top). -->
<div class="req-dasboard-maincontainer req-dasboard-itdesk-container" id="upper-part-ssp" style="display:block; box-sizing:border-box; width:100%; margin:0; padding:0; background-color:#1B365D; border:0; border-radius:0; overflow:hidden">

  <div style="display:block; box-sizing:border-box; width:100%; min-height:560px; margin:0; padding:52px 24px 68px; background-color:#1B365D; background-image:url(/app/itdesk/api/v3/ssp_background_images/273837000000728002/_images/88004); background-repeat:no-repeat; background-position:right 40px top 36px; background-size:330px auto; border-top:5px solid #C99700; text-align:center; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <div aria-label="Commissioner" style="display:block; width:100%; max-width:560px; height:120px; margin:0 auto; background-image:url(/app/itdesk/api/v3/ssp_background_images/273837000000728002/_images/88004); background-repeat:no-repeat; background-position:center; background-size:contain"></div>
    <div aria-hidden="true" style="display:block; width:72px; height:3px; margin:18px auto 12px; background-color:#C99700; border-radius:2px"></div>
    <p style="display:block; margin:0 0 34px; color:#FFFFFF; opacity:0.85; font-size:15px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase">IT Help Desk</p>

    <div class="search-req-dashboard" id="search-req-dashboard_dummy" style="display:block; width:100%; max-width:720px; margin:0 auto 36px; padding:0; float:none">
      <div class="sdpod-input-wrapper req-dashboard-mainsearch" style="display:block; width:100%; margin:0; padding:0">
        <input input-action="search" class="sdpod-input-large" data-clickable="true" tabindex="0" placeholder="{{{ssp-search-placeholder}}}" style="display:block; box-sizing:border-box; width:100%; height:54px; margin:0; padding:0 22px; border:2px solid #FFFFFF; border-radius:999px; background-color:#FFFFFF; color:#1B365D; font-size:16px; box-shadow:0 10px 30px rgba(0,0,0,0.25); outline:none"/>
      </div>
    </div>

    <div class="req-dashboard-innerwrapper" style="display:block; width:100%; max-width:720px; margin:0 auto; padding:0; text-align:left">
      <div class="req-dashboard-card-wrapper request-service-box" style="display:block; width:100%; margin:0; padding:0; float:none">
        <div class="req-dashboard-card req-new" style="display:block; box-sizing:border-box; width:100%; height:auto; min-height:0; margin:0; padding:34px 40px; background-color:#FFFFFF; border:0; border-left:6px solid #C99700; border-radius:14px; box-shadow:0 18px 40px rgba(0,0,0,0.3)">
          <table style="width:100%; border-collapse:collapse; border:0; margin:0; padding:0">
            <tr>
              <td style="width:84px; padding:0 28px 0 0; vertical-align:middle; border:0">
                <div aria-hidden="true" style="display:block; box-sizing:border-box; width:84px; height:84px; margin:0; border-radius:50%; background-color:#1B365D; border:3px solid #C99700; color:#C99700; font-size:50px; font-weight:700; line-height:74px; text-align:center">+</div>
              </td>
              <td style="padding:0; vertical-align:middle; border:0">
                <div class="req-dashboard-innercontent" style="display:block; width:auto; margin:0; padding:0; text-align:left">
                  <span class="req-dashboard-inner-head" style="display:block; color:#C99700; font-size:13px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; margin:0 0 6px">
                    {{{ssp-i-need-something}}}
                  </span>
                  <span class="req-dashboard-inner-h2" style="display:block; color:#1B365D; font-size:40px; font-weight:800; line-height:1.05; margin:0 0 18px">
                    {{{ssp-new}}}
                  </span>
                  <span style="display:block">
                    <button class="req-dashboard-innerbutton" click-action="load-service-templates-popup" id="create_service_btn" style="display:inline-block; box-sizing:border-box; min-width:220px; height:auto; margin:0; padding:14px 30px; background-color:#1B365D; color:#FFFFFF; border:2px solid #C99700; border-radius:999px; font-size:16px; font-weight:700; letter-spacing:0.02em; cursor:pointer; text-align:center">
                      {{{ssp-request-a-service}}}
                    </button>
                  </span>
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
