function timeAgo(ts) {
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function LoginScreen() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleLogin() {
    if (!email || !password) { setError('Enter your credentials.'); return; }
    setLoading(true); setError('');
    const { data, error: err } = await sb.auth.signInWithPassword({ email, password });
    if (err || data?.user?.email !== COACH_EMAIL) {
      await sb.auth.signOut();
      setError('Coach access only.'); setLoading(false);
    }
  }

  return (
    <div className="login-screen">
      <div className="login-logo">Midlife Brotherhood</div>
      <div className="login-sub">Coach Dashboard</div>
      <div className="login-card">
        {error && <div className="error-msg">{error}</div>}
        <label>Email</label>
        <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        <label>Password</label>
        <input type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        <button className="login-btn" onClick={handleLogin} disabled={loading}>{loading?'Checking...':'Enter Dashboard'}</button>
        <div className="login-footer">Authorized personnel only.</div>
      </div>
    </div>
  );
}

function ClientsTab({ coachId }) {
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [editData, setEditData] = useState({});
  const [saved, setSaved] = useState(false);

  useEffect(()=>{ loadClients(); },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('*').order('name');
    setClients(data||[]); setLoading(false);
  }

  function selectClient(c) {
    setSelected(c); setEditData({...c}); setSaved(false);
  }

  async function saveClient() {
    await sb.from('profiles').update({
      name: editData.name,
      day_number: parseInt(editData.day_number)||1,
      streak: parseInt(editData.streak)||0,
      adherence: parseInt(editData.adherence)||0,
      start_weight: parseFloat(editData.start_weight)||0,
      current_weight: parseFloat(editData.current_weight)||0,
      goal_weight: parseFloat(editData.goal_weight)||0,
    }).eq('id', selected.id);
    setSaved(true);
    loadClients();
    setTimeout(()=>setSaved(false), 2000);
  }

  return (
    <div>
      <div className="section-title">The Pack</div>
      <div className="section-sub">All active clients</div>
      {loading && <div className="loading">Loading clients...</div>}
      {!loading && clients.length === 0 && <div className="empty">No clients yet. Add them via Supabase Auth > Invite user.</div>}
      <div className="client-grid">
        {clients.map(c=>(
          <div key={c.id} className={`client-card${selected?.id===c.id?' selected':''}`} onClick={()=>selectClient(c)}>
            <div className="client-avatar">{c.avatar_initials||'?'}</div>
            <div className="client-name">{c.name}</div>
            <div className="client-meta">{c.email} · Day {c.day_number||1} of 90</div>
            <div className="client-stats">
              <div className="mini-stat"><div className="mini-stat-num">{c.current_weight||'--'}</div><div className="mini-stat-label">lbs</div></div>
              <div className="mini-stat"><div className="mini-stat-num">{c.streak||0}</div><div className="mini-stat-label">Streak</div></div>
              <div className="mini-stat"><div className="mini-stat-num">{c.adherence||0}%</div><div className="mini-stat-label">Adhere</div></div>
            </div>
          </div>
        ))}
      </div>

      {selected && (
        <div className="panel">
          <div className="panel-title">Editing — {selected.name}</div>
          <div className="form-row">
            <div className="field"><label>Full Name</label><input value={editData.name||''} onChange={e=>setEditData({...editData,name:e.target.value})}/></div>
            <div className="field"><label>Avatar Initials</label><input value={editData.avatar_initials||''} onChange={e=>setEditData({...editData,avatar_initials:e.target.value})} maxLength={3}/></div>

  const [saved, setSaved] = useState(false);

  const emptyMeal = ()=>({id:Date.now()+Math.random(), meal_time:'', meal_name:'', protein:'', carbs:'', fat:'', calories:'', isNew:true});

  useEffect(()=>{ loadClients(); },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('id,name').order('name');
    setClients(data||[]);
  }

  async function loadMeals(uid) {
    setLoading(true);
    const { data } = await sb.from('meal_plans').select('*').eq('user_id',uid).order('meal_time');
    setMeals(data||[]); setLoading(false);
  }

  function selectClient(uid) {
    setSelectedId(uid);
    if (uid) loadMeals(uid);
    else setMeals([]);
  }

  function updateMeal(idx, field, val) {
    setMeals(m=>m.map((r,i)=>i===idx?{...r,[field]:val}:r));
  }

  function addMeal() { setMeals(m=>[...m, emptyMeal()]); }

  async function removeMeal(meal) {
    if (!meal.isNew) await sb.from('meal_plans').delete().eq('id',meal.id);
    setMeals(m=>m.filter(r=>r.id!==meal.id));
  }

  async function saveMeals() {
    for (const meal of meals) {
      const payload = {
        user_id: selectedId,
        meal_time: meal.meal_time,
        meal_name: meal.meal_name,
        protein: parseInt(meal.protein)||0,
        carbs: parseInt(meal.carbs)||0,
        fat: parseInt(meal.fat)||0,
        calories: parseInt(meal.calories)||0,
      };
      if (meal.isNew) {
        await sb.from('meal_plans').insert(payload);
      } else {
        await sb.from('meal_plans').update(payload).eq('id',meal.id);
      }
    }
    setSaved(true);
    loadMeals(selectedId);
    setTimeout(()=>setSaved(false),2000);
  }

  return (
    <div>
      <div className="section-title">Meal Plans</div>

        </div>

        {selectedId && (
          <div>
            {loading && <div className="loading">Loading meals...</div>}

              <div>
                <div className="meal-row-header">

                  <div key={meal.id} className="meal-row">
                    <input placeholder="6am" value={meal.meal_time} onChange={e=>updateMeal(idx,'meal_time',e.target.value)}/>
                    <input placeholder="Meal name" value={meal.meal_name} onChange={e=>updateMeal(idx,'meal_name',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.protein} onChange={e=>updateMeal(idx,'protein',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.carbs} onChange={e=>updateMeal(idx,'carbs',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.fat} onChange={e=>updateMeal(idx,'fat',e.target.value)}/>

  Purpose: { verb: 'find your mission', pain: 'feeling invisible and directionless', win: 'direction and drive' },
  Finances: { verb: 'get your money right', pain: 'debt, lost time, and playing catch-up', win: 'financial control' },

};

function ceTitleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }

function ceInstantGenerate(rawTopic, pillar) {
  const t = rawTopic.toLowerCase();
  const T = ceTitleCase(rawTopic);
  const angle = CE_PILLAR_ANGLES[pillar] || { verb: 'take back control', pain: 'feeling stuck in midlife', win: 'momentum' };
  const primary = `${t} for men over 40`;
  return {
    primary_keyword: primary,
    keywords: [primary, `${t} after 40`, `how to improve ${t} in your 40s`, `${t} for middle aged men`, `best ${t} tips for men over 50`, `midlife ${t} for men`],
    blog_titles: [
      `${T} After 40: The No-BS Guide for Men Who Want Results`,
      `7 ${T} Mistakes Men Over 40 Keep Making (And How to Fix Them)`,
      `${T} for Men Over 40: What Actually Works (From a Coach Who Lost 100 lbs)`,
    ],
    youtube_titles: [
      `The Truth About ${T} After 40`,
      `${T} Over 40: Stop Doing These 3 Things`,
      `How I Fixed My ${T} in Midlife (Real Talk)`,
    ],
    meta_description: `Struggling with ${t} after 40? The no-fluff plan men 35–60 use to ${angle.verb} and get back ${angle.win}. Zero hype. Start today.`,
    social_hooks: [
      `Nobody is coming to save you. Your ${t} after 40 is your job now — and it's a job you can win.`,
      `At 40+ the rules change. ${T} isn't about motivation anymore. It's about a system you run every day.`,
      `I know ${angle.pain} feels normal at this age. It's common — it's not normal. Fix your ${t} and watch everything else move.`,
    ],
    faq: [
      { question: `Is ${t} harder for men over 40?`,
        answer: `Yes — after 40, ${t} gets harder because your body and life run by different rules than at 25. But harder isn't impossible. With the right system built for midlife men, most guys see real progress in 60–90 days.` },
      { question: `What is the best way for a man over 40 to improve ${t}?`,
        answer: `Start with one daily non-negotiable habit tied to ${t}, track it for 30 days, and get accountability from other men doing the same. Consistency beats intensity every time after 40.` },
      { question: `How long does it take to see ${t} results after 40?`,
        answer: `Most men over 40 notice a difference in ${t} within 4–6 weeks of consistent daily action, with major changes at the 90-day mark. The key is a sustainable system, not a 2-week sprint.` },
    ],
  };
}

const CE_OUTPUT_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['primary_keyword','keywords','blog_titles','youtube_titles','meta_description','social_hooks','faq'],
  properties: {
    primary_keyword: { type: 'string' },
    keywords: { type: 'array', items: { type: 'string' } },
    blog_titles: { type: 'array', items: { type: 'string' } },
    youtube_titles: { type: 'array', items: { type: 'string' } },
    meta_description: { type: 'string' },
    social_hooks: { type: 'array', items: { type: 'string' } },
    faq: { type: 'array', items: { type: 'object', additionalProperties: false,
      required: ['question','answer'],
      properties: { question: { type: 'string' }, answer: { type: 'string' } } } },
  },
};

async function ceAiGenerate(topic, pillar, apiKey, forcedKeyword) {
  const pillarContext = pillar
    ? `The content falls under the "${pillar}" pillar of the Midlife Brotherhood system.`
    : 'The content relates to the Midlife Brotherhood brand covering body, mind, purpose, finances, relationships, and brotherhood.';

  const kwRule = forcedKeyword
    ? `- primary_keyword: use EXACTLY this phrase, word for word, do not change or improve it: "${forcedKeyword}". Build everything below around it.`
    : `- primary_keyword: the single best focus keyword for Rank Math — 3-5 words, high intent, low competition`;

  const prompt = `You are a content strategist and SEO/AEO expert for "The Midlife Brotherhood" — a men's development brand targeting men aged 35–60 going through major life transitions. The brand voice is direct, no-BS, Gen X, slightly urban, coach-to-man. The founder is Billy Mayfield, a nutritional coach and author who lost 100 lbs and raised his testosterone 71% naturally.

Topic: "${topic}"
${pillarContext}

Generate:
${kwRule}
- keywords: 6 specific long-tail phrases men 35–60 actually search (use age qualifiers like "after 40", "over 50", "midlife", "men over 40" where natural)
- blog_titles: 3 SEO-optimized blog titles that start with the primary keyword or a power word
- youtube_titles: 3 titles that create curiosity or promise a specific result, under 60 characters when possible
- meta_description: 150–160 characters for the primary keyword with a subtle call to action
- social_hooks: 3 short punchy Instagram hooks (1–2 sentences, no hashtags) that sound like a real man talking, not a motivational poster
- faq: 3 question/answer pairs — the questions are what men 35–60 would type into ChatGPT, Claude, or Perplexity about this topic; each answer is 2–3 sentences, direct and quotable so an AI assistant could cite it verbatim — lead with the answer, be specific, include the age context

All content must fit the Brotherhood brand voice — direct, honest, no fluff.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 3000,
      output_config: { format: { type: 'json_schema', schema: CE_OUTPUT_SCHEMA } },
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!resp.ok) {
    let msg = `API error (${resp.status})`;
    try { const b = await resp.json(); if (b?.error?.message) msg = b.error.message; } catch (_) {}
    if (resp.status === 401) msg = 'Invalid API key. Check it in API key settings.';
    if (resp.status === 429) msg = 'Rate limited by the API. Wait a minute and try again.';
    throw new Error(msg);
  }
  const data = await resp.json();
  if (data.stop_reason === 'refusal') throw new Error('Claude declined this topic. Try rephrasing it.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text);
}

const CE_IDEA_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['pillar','interpretation','keyword_options','keywords','blog_titles','youtube_titles','meta_description','social_hooks','faq'],
  properties: {
    pillar: { type: 'string', enum: ['Body','Mind','Purpose','Finances','Relationships','Brotherhood'] },
    interpretation: { type: 'string' },
    keyword_options: { type: 'array', items: { type: 'object', additionalProperties: false,
      required: ['keyword','why'],
      properties: { keyword: { type: 'string' }, why: { type: 'string' } } } },
    keywords: { type: 'array', items: { type: 'string' } },
    blog_titles: { type: 'array', items: { type: 'string' } },
    youtube_titles: { type: 'array', items: { type: 'string' } },
    meta_description: { type: 'string' },
    social_hooks: { type: 'array', items: { type: 'string' } },
    faq: { type: 'array', items: { type: 'object', additionalProperties: false,
      required: ['question','answer'],
      properties: { question: { type: 'string' }, answer: { type: 'string' } } } },
  },
};

async function ceAiIdeaGenerate(idea, apiKey) {
  const prompt = `You are a content strategist and SEO/AEO expert for "The Midlife Brotherhood" — a men's development brand targeting men aged 35–60 going through major life transitions. The brand voice is direct, no-BS, Gen X, slightly urban, coach-to-man. The founder is Billy Mayfield, a nutritional coach and author who lost 100 lbs and raised his testosterone 71% naturally.

The six brand pillars are:
- Body: physical health, weight, testosterone, energy, training, nutrition
- Mind: mental health, stress, discipline, focus, mindset, confidence
- Purpose: identity, meaning, direction, career, legacy, "who am I now"
- Finances: money, debt, income, provision, financial control
- Relationships: marriage, dating, fatherhood, family, romantic connection
- Brotherhood: male friendship, community, isolation, accountability, belonging

Here is the writer's raw idea — a title, a rough draft, or just them thinking out loud:
"""
${idea}
"""

The writer's problem: their ideas have great emotional titles but terrible SEO. For example, a post titled "Who would you be if no one told you who you were" should target the keyword "how to find yourself again as a man" — that is what men actually type into Google. Your job is to bridge that gap.

Do this:
1. pillar: pick the ONE best-fitting pillar from the six above.
2. interpretation: 1–2 sentences, written directly to the writer ("Your idea is really about..."), naming the emotional theme AND the searchable angle, so they understand why you chose this pillar and these keywords.
3. keyword_options: EXACTLY 3 focus-keyword candidates, ranked best first. Each is an object with "keyword" (3-5 words, high search intent, low competition, phrased the way a man 35–60 would actually search it — plain-language, problem-first, following the "how to find yourself again as a man" style, NOT the poetic title) and "why" (one short phrase on who searches it / why it fits, e.g. "highest intent — what most men type" or "broader reach, a bit more competition"). Give genuinely different angles, not three rewordings of the same phrase.
4. keywords: 6 specific long-tail phrases men 35–60 actually search around this idea, built around keyword_options[0] (the top pick). Use age qualifiers like "after 40", "over 50", "midlife", "as a man" where natural.
5. blog_titles: 3 SEO-optimized titles built around keyword_options[0] that start with it or a power word — but keep the emotional punch of the original idea where you can.
6. youtube_titles: 3 titles that create curiosity or promise a specific result, under 60 characters when possible.
7. meta_description: 150–160 characters for keyword_options[0] with a subtle call to action.
8. social_hooks: 3 short punchy Instagram hooks (1–2 sentences, no hashtags) that sound like a real man talking, not a motivational poster.
9. faq: 3 question/answer pairs — the questions are what men 35–60 would type into ChatGPT, Claude, or Perplexity about this idea; each answer is 2–3 sentences, direct and quotable so an AI assistant could cite it verbatim — lead with the answer, be specific, include the age context.

Everything from keywords onward is built around keyword_options[0]; the writer can pick a different option afterward to rebuild. All content must fit the Brotherhood brand voice — direct, honest, no fluff.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 3000,
      output_config: { format: { type: 'json_schema', schema: CE_IDEA_SCHEMA } },
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!resp.ok) {
    let msg = `API error (${resp.status})`;
    try { const b = await resp.json(); if (b?.error?.message) msg = b.error.message; } catch (_) {}
    if (resp.status === 401) msg = 'Invalid API key. Check it in API key settings.';
    if (resp.status === 429) msg = 'Rate limited by the API. Wait a minute and try again.';
    throw new Error(msg);
  }
  const data = await resp.json();
  if (data.stop_reason === 'refusal') throw new Error('Claude declined this idea. Try rephrasing it.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text);
}

function ceBuildFaqSchema(faq) {
  const json = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'FAQPage',
    'mainEntity': faq.map(f => ({
      '@type': 'Question', 'name': f.question,
      'acceptedAnswer': { '@type': 'Answer', 'text': f.answer },
    })),
  }, null, 2);
  return '<' + 'script type="application/ld+json">\n' + json + '\n<' + '/script>';
}

function CeCopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  return (
    <button className={`ce-copy${copied?' copied':''}`} onClick={()=>{
      navigator.clipboard.writeText(text).then(()=>{
        setCopied(true); setTimeout(()=>setCopied(false), 1500);
      });
    }}>{copied?'Copied':'Copy'}</button>
  );
}

function CeItem({ text }) {
  return <div className="ce-item"><span>{text}</span><CeCopyBtn text={text}/></div>;
}

function CeCard({ cls, label, hint, mode, children }) {
  return (
    <div className={`ce-card ${cls}`}>
      <div className="ce-card-label">{label} <span className={`ce-badge ${mode==='ai'?'ai':'instant'}`}>{mode==='ai'?'AI':'Instant'}</span></div>
      {hint && <div className="ce-card-hint">{hint}</div>}
      {children}
    </div>
  );
}

function ContentTab() {
  // Restore the last session so results survive tab switches and reloads.
  const SAVED = (()=>{ try { return JSON.parse(localStorage.getItem('mb_ce_state')||'{}'); } catch(_) { return {}; } })();

  const [inputMode, setInputMode] = useState(SAVED.inputMode || 'topic'); // 'topic' | 'idea'
  const [pillar, setPillar] = useState(SAVED.pillar || '');
  const [topic, setTopic] = useState(SAVED.topic || '');
  const [idea, setIdea] = useState(SAVED.idea || '');
  const [useAI, setUseAI] = useState(!!localStorage.getItem('mb_seo_api_key'));
  const [keyOpen, setKeyOpen] = useState(false);
  const [keyDraft, setKeyDraft] = useState('');
  const [status, setStatus] = useState(SAVED.result ? `Primary keyword: "${SAVED.result.primary_keyword}"` : '');
  const [isErr, setIsErr] = useState(false);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(SAVED.result || null);
  const [mode, setMode] = useState(SAVED.mode || 'instant');

  useEffect(()=>{
    try {
      localStorage.setItem('mb_ce_state', JSON.stringify({ inputMode, pillar, topic, idea, result, mode }));
    } catch(_) {}
  }, [inputMode, pillar, topic, idea, result, mode]);
  const [history, setHistory] = useState(()=>JSON.parse(localStorage.getItem('mb_seo_history')||'[]'));

  function note(msg, err) { setStatus(msg); setIsErr(!!err); }

  function saveKey() {
    const k = keyDraft.trim();
    if (k) { localStorage.setItem('mb_seo_api_key', k); setUseAI(true); note('API key saved. AI mode is on.'); }
    setKeyOpen(false);
  }
  function clearKey() {
    localStorage.removeItem('mb_seo_api_key'); setKeyDraft(''); setUseAI(false); note('API key removed.');
  }

  async function generate(overrideTopic) {
    const apiKey = localStorage.getItem('mb_seo_api_key') || '';
    setResult(null);
    try {
      let data, m, label;
      if (inputMode === 'idea') {
        const text = idea.trim();
        if (!text) { note('Describe your idea first.', true); return; }
        if (!apiKey) {
          note('Idea mode needs a Claude API key — add one in API key settings below.', true);
          setKeyOpen(true); return;
        }
        setBusy(true);
        note('Reading your idea and finding the pillar and keywords...');
        data = await ceAiIdeaGenerate(text, apiKey);
        data.primary_keyword = (data.keyword_options && data.keyword_options[0]) ? data.keyword_options[0].keyword : '';
        m = 'ai'; label = data.primary_keyword;
      } else {
        const t = (overrideTopic ?? topic).trim();
        if (!t) { note('Enter a topic first.', true); return; }
        if (useAI && !apiKey) {
          note('AI mode needs an API key — add one in API key settings, or uncheck AI mode.', true);
          setKeyOpen(true); return;
        }
        setBusy(true);
        if (useAI) { note('Asking Claude to work your topic...'); data = await ceAiGenerate(t, pillar, apiKey); m = 'ai'; }
        else { data = ceInstantGenerate(t, pillar); m = 'instant'; }
        label = t;
      }
      const h = [label, ...history.filter(x=>x!==label)].slice(0,8);
      setHistory(h); localStorage.setItem('mb_seo_history', JSON.stringify(h));
      note(`Primary keyword: "${data.primary_keyword}"`);
      setResult(data); setMode(m);
    } catch (err) {
      note(err.message || 'Something went wrong. Try again.', true);
    } finally { setBusy(false); }
  }

  async function selectKeyword(i) {
    if (!result || !result.keyword_options || !result.keyword_options[i]) return;
    const chosen = result.keyword_options[i].keyword;
    if (chosen === result.primary_keyword) return; // already selected
    const apiKey = localStorage.getItem('mb_seo_api_key') || '';
    if (!apiKey) { note('Need an API key to rebuild.', true); return; }
    setBusy(true); note(`Rebuilding around "${chosen}"...`);
    try {
      const data = await ceAiGenerate(chosen, result.pillar, apiKey, chosen);
      data.pillar = result.pillar;
      data.interpretation = result.interpretation;
      data.keyword_options = result.keyword_options;
      data.primary_keyword = chosen;
      setResult(data);
      note(`Primary keyword: "${chosen}"`);
    } catch (err) {
      note(err.message || 'Rebuild failed.', true);
    } finally { setBusy(false); }
  }

  const metaLen = result ? result.meta_description.length : 0;
  const faqSchema = result ? ceBuildFaqSchema(result.faq) : '';

  return (
    <div>
      <div className="section-title">Content Engine</div>
      <div className="section-sub">SEO keywords, titles & AI-search pack</div>
      <div className="panel">
        <div className="ce-mode-toggle">
          <button className={inputMode==='topic'?'active':''} onClick={()=>setInputMode('topic')}>Quick Topic</button>
          <button className={inputMode==='idea'?'active':''} onClick={()=>setInputMode('idea')}>Describe Your Idea</button>
        </div>

        {inputMode==='topic' && (
          <div>
            <div className="panel-title">Pillar (optional)</div>
            <div className="ce-pillar-grid">
              {CE_PILLARS.map(p=>(
                <button key={p} className={`ce-pillar-btn${pillar===p?' active':''}`}
                  onClick={()=>setPillar(pillar===p?'':p)}>{p}</button>
              ))}
            </div>
            <div className="ce-input-row">
              <input placeholder="e.g. testosterone, weight loss, discipline, divorce recovery..."
                value={topic} onChange={e=>setTopic(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&generate()}/>
              <button className="btn-red" onClick={()=>generate()} disabled={busy}>{busy?'Working...':'Generate'}</button>
            </div>
          </div>
        )}

        {inputMode==='idea' && (
          <div>
            <div className="panel-title">Your idea</div>
            <textarea className="ce-idea-box"
              placeholder="Talk about what you want to write. Paste a title, a rough draft, or just riff — e.g. 'I wrote a post called Who Would You Be If No One Told You Who You Were. It's about how men lose themselves in the roles they play...' The engine figures out the pillar and the keyword men actually search for, then builds everything else."
              value={idea} onChange={e=>setIdea(e.target.value)}
              onKeyDown={e=>(e.metaKey||e.ctrlKey)&&e.key==='Enter'&&generate()}/>
            <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
              <button className="btn-red" onClick={()=>generate()} disabled={busy}>{busy?'Working...':'Generate'}</button>
            </div>
          </div>
        )}

        <div className="ce-mode-row" style={{marginTop:12}}>
          {inputMode==='topic'
            ? <label><input type="checkbox" checked={useAI} onChange={e=>setUseAI(e.target.checked)}/> AI mode (Claude — smarter, topic-specific results)</label>
            : <span style={{fontSize:12,color:'var(--grey)'}}>Idea mode always uses Claude (needs your API key).</span>}
          <button className="ce-key-link" onClick={()=>{ setKeyOpen(!keyOpen); setKeyDraft(localStorage.getItem('mb_seo_api_key')||''); }}>API key settings</button>
        </div>
        {keyOpen && (
          <div className="ce-key-panel">
            <p>Claude runs directly from your browser. Get an API key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (requires a small credit balance). The key is saved only in this browser and sent only to api.anthropic.com.</p>
            <div className="ce-key-input-row">
              <input type="password" placeholder="sk-ant-..." value={keyDraft} onChange={e=>setKeyDraft(e.target.value)}/>
              <button className="btn-grey" onClick={saveKey}>Save</button>
              <button className="btn-grey" onClick={clearKey}>Clear</button>
            </div>
          </div>
        )}
        <div className={`ce-status${isErr?' err':''}`}>{status}</div>
        {history.length>0 && !result && inputMode==='topic' && (
          <div className="ce-chips">
            {history.map(t=>(
              <button key={t} className="ce-chip" onClick={()=>{ setTopic(t); generate(t); }}>{t}</button>
            ))}
          </div>
        )}
      </div>

      {result && (
        <div>
          {result.pillar && result.interpretation && (
            <div className="ce-card translate">
              <div className="ce-card-label">What I did with your idea <span className="ce-badge ai">AI</span></div>
              <div><span className="ce-translate-pillar">{result.pillar}</span></div>
              <div className="ce-translate-angle" style={{margin:'10px 0 14px'}}>{result.interpretation}</div>
              {result.keyword_options && result.keyword_options.length ? (
                <div>
                  <div className="panel-title" style={{margin:'0 0 8px'}}>Pick the keyword to build around</div>
                  <div className="ce-kw-options">
                    {result.keyword_options.map((o,i)=>(
                      <button key={i} className={`ce-kw-option${o.keyword===result.primary_keyword?' active':''}`}
                        onClick={()=>selectKeyword(i)} disabled={busy}>
                        <span className="kw">{o.keyword}{i===0 && <span className="rec">Top pick</span>}</span>
                        {o.why && <span className="why">{o.why}</span>}
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="ce-translate-kw">{result.primary_keyword}</div>
              )}
            </div>
          )}
          <CeCard cls="keywords" label="Keywords to target" mode={mode}
            hint="Primary keyword first — use it in your title, first paragraph, and Rank Math focus keyword.">
            {[result.primary_keyword, ...result.keywords.filter(k=>k!==result.primary_keyword)].map((k,i)=><CeItem key={i} text={k}/>)}
          </CeCard>
          <CeCard cls="blog" label="Blog post titles" mode={mode}>
            {result.blog_titles.map((t,i)=><CeItem key={i} text={t}/>)}
          </CeCard>
          <CeCard cls="youtube" label="YouTube titles" mode={mode}>
            {result.youtube_titles.map((t,i)=><CeItem key={i} text={t}/>)}
          </CeCard>
          <CeCard cls="meta" label="Meta description (Rank Math)" mode={mode}>
            <CeItem text={result.meta_description}/>
            <div className="ce-count">{metaLen} characters {metaLen>=140&&metaLen<=160?'✓ good length':'(aim for 150–160)'}</div>
          </CeCard>
          <CeCard cls="social" label="Social media hooks" mode={mode}>
            {result.social_hooks.map((h,i)=><CeItem key={i} text={h}/>)}
          </CeCard>
          <CeCard cls="aeo" label="AI search pack (ChatGPT / Claude / Perplexity)" mode={mode}
            hint="Answer these questions in your post — each question as an H2 or H3 with the answer right below it, word for word. Then paste the FAQ schema into the post (Rank Math: Schema → Custom, or an HTML block) so AI assistants and Google can quote you.">
            {result.faq.map((f,i)=>(
              <div key={i} className="ce-item">
                <span><span className="q">{f.question}</span><span className="a">{f.answer}</span></span>
                <CeCopyBtn text={f.question+'\n\n'+f.answer}/>
              </div>
            ))}
            <div className="ce-card-label" style={{marginTop:14}}>FAQ Schema (paste into your post)</div>
            <pre className="ce-schema">{faqSchema}</pre>
            <div style={{marginTop:8}}><CeCopyBtn text={faqSchema}/></div>
          </CeCard>
        </div>
      )}
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [tab, setTab] = useState('clients');

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user?.email === COACH_EMAIL) setSession(session);
      setAuthLoading(false);
    });
    sb.auth.onAuthStateChange((_,session)=>{
      if (session?.user?.email === COACH_EMAIL) setSession(session);
      else { setSession(null); setAuthLoading(false); }
    });
  },[]);

  async function handleLogout() {
    await sb.auth.signOut();
    setSession(null);
  }

  if (authLoading) return <div className="loading" style={{paddingTop:80}}>Loading...</div>;
  if (!session) return <LoginScreen/>;

  const tabs = [
    {key:'clients',label:'Clients'},
    {key:'meals',label:'Meal Plans'},
    {key:'messages',label:'Messages'},
    {key:'checkins',label:'Check-ins'},
    {key:'measurements',label:'Measurements'},
    {key:'photos',label:'Photos'},
    {key:'content',label:'Content Engine'},
  ];

  return (
    <div style={{background:'var(--black)',minHeight:'100vh'}}>
      <div className="top-nav">
        <div className="nav-logo">MB<span>.</span> <span style={{fontSize:14,color:'var(--grey)',fontFamily:'Barlow Condensed',letterSpacing:2}}>COACH</span></div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div className="nav-badge">Coach</div>
          <button className="logout-btn" onClick={handleLogout}>Sign Out</button>
        </div>
      </div>
      <div className="tab-bar">
        {tabs.map(t=>(
          <button key={t.key} className={`tab-btn${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>{t.label}</button>
        ))}
      </div>
      <div className="main">
        {tab==='clients' && <ClientsTab coachId={session.user.id}/>}
        {tab==='meals' && <MealsTab coachId={session.user.id}/>}
        {tab==='messages' && <MessagesTab coachId={session.user.id}/>}
        {tab==='checkins' && <CheckinsTab/>}
        {tab==='measurements' && <MeasurementsTab/>}
        {tab==='photos' && <PhotosTab/>}
        {tab==='content' && <ContentTab/>}
      </div>
    </div>
  );
}

const styleEl = document.createElement('style');
styleEl.textContent = styles;
document.head.appendChild(styleEl);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
