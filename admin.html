function timeAgo(ts) {
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function LoginScreen() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleLogin() {
    if (!email || !password) { setError('Enter your credentials.'); return; }
    setLoading(true); setError('');
    const { data, error: err } = await sb.auth.signInWithPassword({ email, password });
    if (err || data?.user?.email !== COACH_EMAIL) {
      await sb.auth.signOut();
      setError('Coach access only.'); setLoading(false);
    }
  }

  return (
    <div className="login-screen">
      <div className="login-logo">Midlife Brotherhood</div>
      <div className="login-sub">Coach Dashboard</div>
      <div className="login-card">
        {error && <div className="error-msg">{error}</div>}
        <label>Email</label>
        <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        <label>Password</label>
        <input type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        <button className="login-btn" onClick={handleLogin} disabled={loading}>{loading?'Checking...':'Enter Dashboard'}</button>
        <div className="login-footer">Authorized personnel only.</div>
      </div>
    </div>
  );
}

function MealsTab({ coachId }) {
  const [clients, setClients] = useState([]);
  const [selectedId, setSelectedId] = useState('');
  const [meals, setMeals] = useState([]);
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(false);

  const emptyMeal = ()=>({id:Date.now()+Math.random(), meal_time:'', meal_name:'', protein:'', carbs:'', fat:'', calories:'', isNew:true});

  useEffect(()=>{ loadClients(); },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('id,name').order('name');
    setClients(data||[]);
  }

  async function loadMeals(uid) {
    setLoading(true);
    const { data } = await sb.from('meal_plans').select('*').eq('user_id',uid).order('meal_time');
    setMeals(data||[]); setLoading(false);
  }

  function selectClient(uid) {
    setSelectedId(uid);
    if (uid) loadMeals(uid);
    else setMeals([]);
  }

  function updateMeal(idx, field, val) {
    setMeals(m=>m.map((r,i)=>i===idx?{...r,[field]:val}:r));
  }

  function addMeal() { setMeals(m=>[...m, emptyMeal()]); }

  async function removeMeal(meal) {
    if (!meal.isNew) await sb.from('meal_plans').delete().eq('id',meal.id);
    setMeals(m=>m.filter(r=>r.id!==meal.id));
  }

  async function saveMeals() {
    for (const meal of meals) {
      const payload = {
        user_id: selectedId,
        meal_time: meal.meal_time,
        meal_name: meal.meal_name,
        protein: parseInt(meal.protein)||0,
        carbs: parseInt(meal.carbs)||0,
        fat: parseInt(meal.fat)||0,
        calories: parseInt(meal.calories)||0,
      };
      if (meal.isNew) {
        await sb.from('meal_plans').insert(payload);
      } else {
        await sb.from('meal_plans').update(payload).eq('id',meal.id);
      }
    }
    setSaved(true);
    loadMeals(selectedId);
    setTimeout(()=>setSaved(false),2000);
  }

  return (
    <div>
      <div className="section-title">Meal Plans</div>
      <div className="section-sub">Assign and edit client nutrition</div>
      <div className="panel">
        <div className="field" style={{marginBottom:16}}>
          <label>Select Client</label>
          <select value={selectedId} onChange={e=>selectClient(e.target.value)}>
            <option value="">-- Choose a client --</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>

        {selectedId && (
          <div>
            {loading && <div className="loading">Loading meals...</div>}
            {!loading && (
              <div>
                <div className="meal-row-header">
                  <span>Time</span><span>Meal</span><span>Protein</span><span>Carbs</span><span>Fat</span><span>Calories</span><span></span>
                </div>
                {meals.map((meal,idx)=>(
                  <div key={meal.id} className="meal-row">
                    <input placeholder="6am" value={meal.meal_time} onChange={e=>updateMeal(idx,'meal_time',e.target.value)}/>
                    <input placeholder="Meal name" value={meal.meal_name} onChange={e=>updateMeal(idx,'meal_name',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.protein} onChange={e=>updateMeal(idx,'protein',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.carbs} onChange={e=>updateMeal(idx,'carbs',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.fat} onChange={e=>updateMeal(idx,'fat',e.target.value)}/>
                    <input type="number" placeholder="0" value={meal.calories} onChange={e=>updateMeal(idx,'calories',e.target.value)}/>
                    <button className="remove-btn" onClick={()=>removeMeal(meal)}><i className="ti ti-x"/></button>
                  </div>
                ))}
                {meals.length===0 && <div className="empty">No meals yet. Add one below.</div>}
                <div className="btn-row">
                  <button className="btn-grey" onClick={addMeal}><i className="ti ti-plus"/> Add Meal</button>
                  <button className="btn-red" onClick={saveMeals}>Save Plan</button>
                </div>
                {saved && <div className="success-msg">Meal plan saved.</div>}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function MessagesTab({ coachId }) {
  const [clients, setClients] = useState([]);
  const [selectedId, setSelectedId] = useState('');
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(()=>{ loadClients(); },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('id,name').order('name');
    setClients(data||[]);
  }

  async function loadMessages(uid) {
    setLoading(true);
    const { data } = await sb.from('messages').select('*')
      .or(`sender_id.eq.${uid},recipient_id.eq.${uid}`)
      .order('created_at',{ascending:true}).limit(50);
    setMessages(data||[]); setLoading(false);
  }

  function selectClient(uid) {
    setSelectedId(uid);
    if (uid) loadMessages(uid);
    else setMessages([]);
  }

  async function sendMessage() {
    if (!text.trim() || !selectedId) return;
    await sb.from('messages').insert({
      sender_id: coachId,
      recipient_id: selectedId,
      content: text,
      from_coach: true
    });
    setText('');
    loadMessages(selectedId);
  }

  const clientName = clients.find(c=>c.id===selectedId)?.name || '';

  return (
    <div>
      <div className="section-title">Coach Inbox</div>
      <div className="section-sub">Message your clients directly</div>
      <div className="panel">
        <div className="field" style={{marginBottom:16}}>
          <label>Select Client</label>
          <select value={selectedId} onChange={e=>selectClient(e.target.value)}>
            <option value="">-- Choose a client --</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>

        {selectedId && (
          <div>
            {loading && <div className="loading">Loading messages...</div>}
            <div className="message-thread">
              {messages.map(m=>(
                <div key={m.id} className={`msg-item ${m.from_coach?'msg-coach':'msg-client'}`}>
                  <div className={`msg-from ${m.from_coach?'coach':'client'}`}>{m.from_coach?'Coach Billy':clientName} · {timeAgo(m.created_at)}</div>
                  {m.content}
                </div>
              ))}
              {!loading && messages.length===0 && <div className="empty">No messages yet with this client.</div>}
            </div>
            <div className="field"><label>Your Message</label><textarea placeholder={`Write to ${clientName}...`} value={text} onChange={e=>setText(e.target.value)}/></div>
            <div className="btn-row"><button className="btn-red" onClick={sendMessage}>Send Message</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

  const lbsToKg = v => v ? (parseFloat(v) * 0.453592).toFixed(1) : '';
  const inToCm = v => v ? (parseFloat(v) * 2.54).toFixed(1) : '';

  useEffect(()=>{ loadClients(); },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('id,name').order('name');
    setClients(data||[]);
  }

  async function loadMeasurements(uid) {
    setLoading(true);
    const { data } = await sb.from('measurements').select('*').eq('user_id', uid).order('created_at', {ascending:false}).limit(20);
    setMeasurements(data||[]); setLoading(false);
  }

  function selectClient(uid) {
    setSelectedId(uid);
    if (uid) loadMeasurements(uid);
    else setMeasurements([]);
  }

  const fields = [
    ['weight','Weight',true],['shoulders','Shoulders',false],['chest','Chest',false],
    ['upper_arm_right','Bicep R',false],['upper_arm_left','Bicep L',false],
    ['waist','Waist',false],['hips','Hips',false],
    ['thigh_right','Thigh R',false],['thigh_left','Thigh L',false],
    ['calf_right','Calf R',false],['calf_left','Calf L',false],

  function displayVal(val, isWeight) {

    if (unit === 'metric') return isWeight ? lbsToKg(val) : inToCm(val);

  return (

function ceTitleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }

    primary_keyword: primary,

    blog_titles: [

    ],
    youtube_titles: [
      `The Truth About ${T} After 40`,
      `${T} Over 40: Stop Doing These 3 Things`,
      `How I Fixed My ${T} in Midlife (Real Talk)`,
    ],
    meta_description: `Struggling with ${t} after 40? The no-fluff plan men 35–60 use to ${angle.verb} and get back ${angle.win}. Zero hype. Start today.`,
    social_hooks: [
      `Nobody is coming to save you. Your ${t} after 40 is your job now — and it's a job you can win.`,
      `At 40+ the rules change. ${T} isn't about motivation anymore. It's about a system you run every day.`,

      { question: `What is the best way for a man over 40 to improve ${t}?`,

      { question: `How long does it take to see ${t} results after 40?`,

const CE_OUTPUT_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['primary_keyword','keywords','blog_titles','youtube_titles','meta_description','social_hooks','faq'],
  properties: {
    primary_keyword: { type: 'string' },
    keywords: { type: 'array', items: { type: 'string' } },
    blog_titles: { type: 'array', items: { type: 'string' } },
    youtube_titles: { type: 'array', items: { type: 'string' } },
    meta_description: { type: 'string' },
    social_hooks: { type: 'array', items: { type: 'string' } },
    faq: { type: 'array', items: { type: 'object', additionalProperties: false,
      required: ['question','answer'],
      properties: { question: { type: 'string' }, answer: { type: 'string' } } } },
  },
};

async function ceAiGenerate(topic, pillar, apiKey) {
  const pillarContext = pillar
    ? `The content falls under the "${pillar}" pillar of the Midlife Brotherhood system.`
    : 'The content relates to the Midlife Brotherhood brand covering body, mind, purpose, finances, relationships, and brotherhood.';

  const prompt = `You are a content strategist and SEO/AEO expert for "The Midlife Brotherhood" — a men's development brand targeting men aged 35–60 going through major life transitions. The brand voice is direct, no-BS, Gen X, slightly urban, coach-to-man. The founder is Billy Mayfield, a nutritional coach and author who lost 100 lbs and raised his testosterone 71% naturally.

Topic: "${topic}"
${pillarContext}

Generate:
- primary_keyword: the single best focus keyword for Rank Math — 3-5 words, high intent, low competition
- keywords: 6 specific long-tail phrases men 35–60 actually search (use age qualifiers like "after 40", "over 50", "midlife", "men over 40" where natural)
- blog_titles: 3 SEO-optimized blog titles that start with the primary keyword or a power word
- youtube_titles: 3 titles that create curiosity or promise a specific result, under 60 characters when possible
- meta_description: 150–160 characters for the primary keyword with a subtle call to action
- social_hooks: 3 short punchy Instagram hooks (1–2 sentences, no hashtags) that sound like a real man talking, not a motivational poster
- faq: 3 question/answer pairs — the questions are what men 35–60 would type into ChatGPT, Claude, or Perplexity about this topic; each answer is 2–3 sentences, direct and quotable so an AI assistant could cite it verbatim — lead with the answer, be specific, include the age context

All content must fit the Brotherhood brand voice — direct, honest, no fluff.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 3000,
      output_config: { format: { type: 'json_schema', schema: CE_OUTPUT_SCHEMA } },
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!resp.ok) {
    let msg = `API error (${resp.status})`;
    try { const b = await resp.json(); if (b?.error?.message) msg = b.error.message; } catch (_) {}
    if (resp.status === 401) msg = 'Invalid API key. Check it in API key settings.';
    if (resp.status === 429) msg = 'Rate limited by the API. Wait a minute and try again.';
    throw new Error(msg);
  }
  const data = await resp.json();
  if (data.stop_reason === 'refusal') throw new Error('Claude declined this topic. Try rephrasing it.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text);
}

function ceBuildFaqSchema(faq) {
  const json = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'FAQPage',
    'mainEntity': faq.map(f => ({
      '@type': 'Question', 'name': f.question,
      'acceptedAnswer': { '@type': 'Answer', 'text': f.answer },
    })),
  }, null, 2);
  return '<' + 'script type="application/ld+json">\n' + json + '\n<' + '/script>';
}

function CeCopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  return (
    <button className={`ce-copy${copied?' copied':''}`} onClick={()=>{

        setCopied(true); setTimeout(()=>setCopied(false), 1500);
      });
    }}>{copied?'Copied':'Copy'}</button>
  );
}

function CeItem({ text }) {

function ContentTab() {
  const [pillar, setPillar] = useState('');
  const [topic, setTopic] = useState('');
  const [useAI, setUseAI] = useState(!!localStorage.getItem('mb_seo_api_key'));
  const [keyOpen, setKeyOpen] = useState(false);
  const [keyDraft, setKeyDraft] = useState('');
  const [status, setStatus] = useState('');
  const [isErr, setIsErr] = useState(false);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [mode, setMode] = useState('instant');
  const [history, setHistory] = useState(()=>JSON.parse(localStorage.getItem('mb_seo_history')||'[]'));

  function note(msg, err) { setStatus(msg); setIsErr(!!err); }

  function saveKey() {
    const k = keyDraft.trim();
    if (k) { localStorage.setItem('mb_seo_api_key', k); setUseAI(true); note('API key saved. AI mode is on.'); }
    setKeyOpen(false);
  }
  function clearKey() {
    localStorage.removeItem('mb_seo_api_key'); setKeyDraft(''); setUseAI(false); note('API key removed.');
  }

  async function generate(overrideTopic) {
    const t = (overrideTopic ?? topic).trim();
    if (!t) { note('Enter a topic first.', true); return; }
    const apiKey = localStorage.getItem('mb_seo_api_key') || '';
    if (useAI && !apiKey) {
      note('AI mode needs an API key — add one in API key settings, or uncheck AI mode.', true);
      setKeyOpen(true); return;
    }
    setBusy(true); setResult(null);
    try {
      let data, m;
      if (useAI) { note('Asking Claude to work your topic...'); data = await ceAiGenerate(t, pillar, apiKey); m = 'ai'; }
      else { data = ceInstantGenerate(t, pillar); m = 'instant'; }
      const h = [t, ...history.filter(x=>x!==t)].slice(0,8);
      setHistory(h); localStorage.setItem('mb_seo_history', JSON.stringify(h));
      note(`Primary keyword: "${data.primary_keyword}"`);
      setResult(data); setMode(m);
    } catch (err) {
      note(err.message || 'Something went wrong. Try again.', true);
    } finally { setBusy(false); }
  }

  const metaLen = result ? result.meta_description.length : 0;
  const faqSchema = result ? ceBuildFaqSchema(result.faq) : '';

  return (
    <div>
      <div className="section-title">Content Engine</div>
      <div className="section-sub">SEO keywords, titles & AI-search pack</div>
      <div className="panel">
        <div className="panel-title">Pillar (optional)</div>
        <div className="ce-pillar-grid">
          {CE_PILLARS.map(p=>(
            <button key={p} className={`ce-pillar-btn${pillar===p?' active':''}`}
              onClick={()=>setPillar(pillar===p?'':p)}>{p}</button>
          ))}
        </div>
        <div className="ce-input-row">
          <input placeholder="e.g. testosterone, weight loss, discipline, divorce recovery..."
            value={topic} onChange={e=>setTopic(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&generate()}/>
          <button className="btn-red" onClick={()=>generate()} disabled={busy}>{busy?'Working...':'Generate'}</button>
        </div>
        <div className="ce-mode-row">
          <label><input type="checkbox" checked={useAI} onChange={e=>setUseAI(e.target.checked)}/> AI mode (Claude — smarter, topic-specific results)</label>
          <button className="ce-key-link" onClick={()=>{ setKeyOpen(!keyOpen); setKeyDraft(localStorage.getItem('mb_seo_api_key')||''); }}>API key settings</button>
        </div>
        {keyOpen && (
          <div className="ce-key-panel">
            <p>AI mode calls Claude directly from your browser. Get an API key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (requires a small credit balance). The key is saved only in this browser and sent only to api.anthropic.com.</p>
            <div className="ce-key-input-row">
              <input type="password" placeholder="sk-ant-..." value={keyDraft} onChange={e=>setKeyDraft(e.target.value)}/>
              <button className="btn-grey" onClick={saveKey}>Save</button>
              <button className="btn-grey" onClick={clearKey}>Clear</button>
            </div>
          </div>
        )}
        <div className={`ce-status${isErr?' err':''}`}>{status}</div>
        {history.length>0 && !result && (
          <div className="ce-chips">
            {history.map(t=>(
              <button key={t} className="ce-chip" onClick={()=>{ setTopic(t); generate(t); }}>{t}</button>
            ))}
          </div>
        )}
      </div>

      {result && (
        <div>
          <CeCard cls="keywords" label="Keywords to target" mode={mode}
            hint="Primary keyword first — use it in your title, first paragraph, and Rank Math focus keyword.">
            {[result.primary_keyword, ...result.keywords.filter(k=>k!==result.primary_keyword)].map((k,i)=><CeItem key={i} text={k}/>)}
          </CeCard>
          <CeCard cls="blog" label="Blog post titles" mode={mode}>
            {result.blog_titles.map((t,i)=><CeItem key={i} text={t}/>)}
          </CeCard>
          <CeCard cls="youtube" label="YouTube titles" mode={mode}>
            {result.youtube_titles.map((t,i)=><CeItem key={i} text={t}/>)}
          </CeCard>
          <CeCard cls="meta" label="Meta description (Rank Math)" mode={mode}>
            <CeItem text={result.meta_description}/>
            <div className="ce-count">{metaLen} characters {metaLen>=140&&metaLen<=160?'✓ good length':'(aim for 150–160)'}</div>
          </CeCard>
          <CeCard cls="social" label="Social media hooks" mode={mode}>
            {result.social_hooks.map((h,i)=><CeItem key={i} text={h}/>)}
          </CeCard>
          <CeCard cls="aeo" label="AI search pack (ChatGPT / Claude / Perplexity)" mode={mode}
            hint="Answer these questions in your post — each question as an H2 or H3 with the answer right below it, word for word. Then paste the FAQ schema into the post (Rank Math: Schema → Custom, or an HTML block) so AI assistants and Google can quote you.">
            {result.faq.map((f,i)=>(
              <div key={i} className="ce-item">
                <span><span className="q">{f.question}</span><span className="a">{f.answer}</span></span>
                <CeCopyBtn text={f.question+'\n\n'+f.answer}/>
              </div>
            ))}
            <div className="ce-card-label" style={{marginTop:14}}>FAQ Schema (paste into your post)</div>
            <pre className="ce-schema">{faqSchema}</pre>
            <div style={{marginTop:8}}><CeCopyBtn text={faqSchema}/></div>
          </CeCard>
        </div>
      )}
    </div>
  );
}

/* ===================== Plan Builder (macros -> cookbook -> assigned plan) == */

function DayEditor({ day, targets, lib, label, onChange, onShuffle }) {
  const T = targets;
  const fit = MB.fitLabel(day, T);
  const tot = day.totalsAdjusted || day.totals;
  const gap = day.gapAdjusted || day.gap;

  function setServings(idx, val) {
    const next = MB.cloneDay(day);
    next.meals[idx].servings = Math.max(0.25, Math.round(val * 4) / 4);
    MB.recomputeDay(next, T);
    onChange(next);
  }
  function swapRecipe(idx, recipeId) {
    const pool = MB.poolFor(lib, day.meals[idx].slot);
    const found = pool.filter(r => String(r.id) === String(recipeId))[0];
    if (!found) return;
    const next = MB.cloneDay(day);
    next.meals[idx].recipe = found;
    MB.recomputeDay(next, T);
    onChange(next);
  }
  function removeMeal(idx) {
    if (day.meals.length <= 1) return;
    const next = MB.cloneDay(day);
    next.meals.splice(idx, 1);
    MB.recomputeDay(next, T);
    onChange(next);
  }

  return (
    <div className="day-card">
      <div className="day-head">
        <div className="day-title">{label}</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className={`fit-badge ${fit.key}`}>{fit.label}</div>
          {onShuffle && <button className="btn-grey" onClick={onShuffle}><i className="ti ti-refresh"/> Shuffle</button>}
        </div>
      </div>

      {day.meals.map((m, i) => {
        const pool = MB.poolFor(lib, m.slot);
        return (
          <div key={i} className="pm-row">
            <div className="pm-slot">{m.slot === 'snacks' ? 'snack' : m.slot}</div>
            <select value={m.recipe.id} onChange={e=>swapRecipe(i, e.target.value)}>
              {pool.filter(r => String(r.id) === String(m.recipe.id)).length === 0 && (
                <option value={m.recipe.id}>{m.recipe.name} (not in library)</option>
              )}
              {pool.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
            <div className="pm-serv">
              <button onClick={()=>setServings(i, m.servings - 0.25)}>−</button>
              <span>{m.servings}</span>
              <button onClick={()=>setServings(i, m.servings + 0.25)}>+</button>
            </div>
            <div className="pm-macros">
              <b>{m.calories}</b>
              {m.protein}P · {m.carbs}C · {m.fat}F
            </div>
            <button className="remove-btn" onClick={()=>removeMeal(i)} title="Remove"><i className="ti ti-x"/></button>
          </div>
        );
      })}

      {day.adjustments && day.adjustments.length > 0 && (
        <div className="plan-adjust">
          <div className="plan-adjust-head">Adjustments to land the macros</div>
          {day.adjustments.map((a,i)=>(
            <div key={i} className="plan-adjust-row">
              <i className={`ti ${a.trim ? 'ti-minus' : 'ti-plus'}`}/>
              <span>{a.text}</span>
              <b>{a.calories > 0 ? '+' : ''}{a.calories} cal</b>
            </div>
          ))}
        </div>
      )}

      <div className="tot-grid">
        {[['Calories','calories',''],['Protein','protein','g'],['Carbs','carbs','g'],['Fat','fat','g']].map(([lab,key,u])=>{
          const off = Math.abs(gap[key]) / (T[key] || 1) > 0.1;
          return (
            <div key={key} className="tot-cell">
              <div className="tot-label">{lab}</div>
              <div className="tot-val">{tot[key]}{u} <span style={{fontSize:12,color:'var(--grey)'}}>/ {T[key]}{u}</span></div>
              <div className={`tot-gap ${off?'off':'on'}`}>{gap[key] > 0 ? '+' : ''}{gap[key]}{u} off target</div>
            </div>
          );
        })}
      </div>
      <div className="pb-note">{fit.hint}{MB.portionNote(day) ? ' ' + MB.portionNote(day) : ''}</div>
    </div>
  );
}

            ))}
          </select>
          <div className="pm-macros"><b>~{m.est.calories}</b>{m.est.protein}P · {m.est.carbs}C · {m.est.fat}F</div>
        </div>
      ))}

      {day.snacks.map((sn,i)=>(
        <div key={'s'+i} className="pm-row kl">
          <div className="pm-slot">snack</div>
          <select value={sn.key} onChange={e=>change(d=>{ d.snacks[i].key = e.target.value; })}>
            {MB.KLEIN_SNACKS.map(f=><option key={f.key} value={f.key}>{f.name}</option>)}
          </select>
          <div className="pm-time">{sn.time}</div>
          <div className="pm-macros"><b>~{sn.est.calories}</b>{sn.est.protein}P · {sn.est.carbs}C · {sn.est.fat}F</div>
        </div>
      ))}

      <div className="plan-adjust">
        <div className="plan-adjust-head">Healthy fats</div>
        <div className="plan-adjust-row"><span>{day.fatText}</span><b>~{day.fatEst.calories} cal</b></div>
      </div>
      <div className="pb-note">
        Every main meal also gets vegetables: {day.portions.vegText}. The numbers here are a rough estimate for you. Your client only sees ounces, cups, and how to cook it.
      </div>
    </div>
  );
}

function PlanBuilderTab({ coachId }) {
  const [clients, setClients] = useState([]);
  const [selectedId, setSelectedId] = useState('');
  const [lib, setLib] = useState([]);
  const [libNote, setLibNote] = useState('');
  const [requests, setRequests] = useState([]);

  const [sex, setSex] = useState('male');
  const [age, setAge] = useState('');
  const [heightFt, setHeightFt] = useState('');
  const [heightIn, setHeightIn] = useState('');
  const [weight, setWeight] = useState('');
  const [activity, setActivity] = useState('1.55');
  const [goal, setGoal] = useState('lean_bulk');
  const [splitKey, setSplitKey] = useState('35_35_30');
  const [cp, setCp] = useState(35);
  const [cc, setCc] = useState(35);
  const [cf, setCf] = useState(30);
  const [mealCount, setMealCount] = useState(5);

  const [targets, setTargets] = useState(null);
  const [day, setDay] = useState(null);
  const [week, setWeek] = useState(null);
  const [seed, setSeed] = useState(1);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  // Plan style: cookbook recipes hitting macro targets, or Klein Method portions.
  const [method, setMethod] = useState('recipes');
  const [kGoal, setKGoal] = useState('hold');
  const [kSnacks, setKSnacks] = useState(2);
  const [kOff, setKOff] = useState({});
  const [kDay, setKDay] = useState(null);
  const [kWeek, setKWeek] = useState(null);
  const [confirming, setConfirming] = useState(false);
  const [saved, setSaved] = useState('');

  useEffect(()=>{
    loadClients();
    loadRequests();
    MB.loadLibrary(sb, (recipes, source, note)=>{
      setLib(recipes);
      setLibNote(source === 'supabase'
        ? recipes.length + ' recipes in the library'
        : 'No recipes loaded \u2014 open the Recipes tab');
    });
  },[]);

  async function loadClients() {
    const { data } = await sb.from('profiles').select('*').order('name');
    setClients(data||[]);
  }

  async function loadRequests() {
    const { data } = await sb.from('plan_requests').select('*').eq('status','pending').order('created_at',{ascending:false});
    setRequests(data||[]);
  }

  function selectClient(uid) {
    setSelectedId(uid);
    setTargets(null); setDay(null); setWeek(null); setSaved(''); setError(''); setConfirming(false);
    setKDay(null); setKWeek(null);
    const c = clients.filter(x=>x.id===uid)[0];
    if (!c) return;
    setSex(c.sex || 'male');
    setAge(c.age || '');
    setWeight(c.current_weight || '');
    if (c.height_in) { setHeightFt(Math.floor(c.height_in/12)); setHeightIn(Math.round(c.height_in%12)); }
    else { setHeightFt(''); setHeightIn(''); }
    setActivity(c.activity_factor ? String(c.activity_factor) : '1.55');
    setGoal(c.goal || 'lean_bulk');
    setSplitKey(c.split_key || '35_35_30');
    if (c.split_protein_pct) { setCp(c.split_protein_pct); setCc(c.split_carbs_pct); setCf(c.split_fat_pct); }
    setMealCount(c.meals_per_day || 5);
  }

  function runNumbers() {
    const t = MB.calcTargets({
      sex, age: parseFloat(age), weightLbs: parseFloat(weight),
      heightIn: (parseFloat(heightFt)||0)*12 + (parseFloat(heightIn)||0),
      activity, goal, splitKey,
      customSplit: splitKey === 'custom' ? {p:Number(cp)/100, c:Number(cc)/100, f:Number(cf)/100} : null
    });
    if (!t.ok) { setError(t.errors[0]); setTargets(null); return; }
    setError(''); setTargets(t); setDay(null); setWeek(null); setSaved('');
  }

  function targetObj(t) {
    return {calories:t.calories, protein:t.protein, carbs:t.carbs, fat:t.fat};
  }

  const NO_LIBRARY = 'The recipe library is empty, so there is nothing to build from. Load your recipes on the Recipes tab first.';

  function buildOne(nextSeed) {
    if (!targets) return;
    if (!lib.length) { setError(NO_LIBRARY); return; }
    setBusy(true); setWeek(null); setSaved('');
    const s = nextSeed == null ? seed : nextSeed; setSeed(s);
    setTimeout(()=>{
      const T = targetObj(targets);
      const d = MB.buildDay(lib, T, {mealCount:Number(mealCount), seed:s});
      if (d.error) { setError(d.error); setDay(null); setBusy(false); return; }
      MB.closeGap(d, T);
      setError(''); setDay(d); setBusy(false);
    }, 20);
  }

  function buildWeek(nextSeed) {
    if (!targets) return;
    if (!lib.length) { setError(NO_LIBRARY); return; }
    setBusy(true); setDay(null); setSaved('');
    const s = nextSeed == null ? seed : nextSeed; setSeed(s);
    setTimeout(()=>{
      const T = targetObj(targets);
      const w = MB.buildWeek(lib, T, {mealCount:Number(mealCount), seed:s, days:7});
      if (w.error) { setError(w.error); setWeek(null); setBusy(false); return; }
      setError(''); setWeek(w.days); setBusy(false);
    }, 20);
  }

  function switchMethod(m) {
    setMethod(m); setError(''); setSaved(''); setConfirming(false);
    setDay(null); setWeek(null); setKDay(null); setKWeek(null);
  }

  const kExcluded = () => Object.keys(kOff).filter(k => kOff[k]);
  const kPortions = MB.kleinPortions(weight, kGoal);

  // How a Klein plan stacks up against the client's maintenance, when the
  // formulas have been run for him. Coach-only.
  const kMaint = Number((clients.filter(c=>c.id===selectedId)[0]||{}).tdee_average) || 0;
  const kEstCal = kWeek ? Math.round(kWeek.reduce((n,d)=>n + d.estimate.calories, 0) / kWeek.length)
                        : kDay ? kDay.estimate.calories : 0;
  const kUnderPct = kMaint && kEstCal ? Math.round((1 - kEstCal / kMaint) * 100) : null;

  function buildKlein(mode, nextSeed) {
    const s = nextSeed == null ? seed : nextSeed; setSeed(s);
    setSaved(''); setConfirming(false);
    const opts = {goal: kGoal, snacks: kSnacks, seed: s, exclude: kExcluded()};
    if (mode === 'week') {
      const w = MB.buildKleinWeek(weight, opts);
      if (w.error) { setError(w.error); setKWeek(null); return; }
      setError(''); setKDay(null); setKWeek(w.days);
    } else {
      const d = MB.buildKleinDay(weight, opts);
      if (d.error) { setError(d.error); setKDay(null); return; }
      setError(''); setKWeek(null); setKDay(d);
    }
  }

  // Pull a client-submitted plan into the builder so it can be edited, not
  // just rubber-stamped.
  function loadRequest(req) {
    const t = req.targets || {};
    setSelectedId(req.user_id);
    if (t.method === 'klein') {
      setMethod('klein'); setTargets(null); setDay(null); setWeek(null); setError(''); setSaved(''); setConfirming(false);
      setWeight(t.weightLbs ? Math.round(t.weightLbs) : '');
      setKGoal(t.goal || 'hold');
      setKSnacks(t.snacks || 2);
      const offMap = {}; (t.exclude || []).forEach(k => { offMap[k] = true; }); setKOff(offMap);
      setKWeek(null); setKDay(MB.kleinDayFromJson(req.plan || {}));
      return;
    }
    setMethod('recipes'); setKDay(null); setKWeek(null);
    if (t.input) {
      setSex(t.input.sex || 'male');
      setAge(t.input.age || '');
      setWeight(t.input.weightLbs ? Math.round(t.input.weightLbs) : '');
      if (t.input.heightIn) { setHeightFt(Math.floor(t.input.heightIn/12)); setHeightIn(Math.round(t.input.heightIn%12)); }
      setActivity(String(t.input.activity || 1.55));
      setGoal(t.input.goal || 'lean_bulk');
    }
    if (t.split) {
      const matched = MB.SPLITS.filter(s=>s.key===t.split.key)[0];
      setSplitKey(matched ? matched.key : 'custom');
      setCp(t.split.p); setCc(t.split.c); setCf(t.split.f);
    }
    const built = {
      ok: true, errors: [],
      input: t.input || {}, bmr: t.bmr || {}, tdee: t.tdee || {},
      split: t.split || {p:35,c:35,f:30,key:'35_35_30',label:'Brotherhood Standard'},
      calories: t.calories, protein: t.protein, carbs: t.carbs, fat: t.fat,
      perLb: {protein:0,carbs:0,fat:0}, fatPctCalories: 0, flags: t.flags || []
    };
    setTargets(built);
    setWeek(null); setError(''); setSaved('');

    const plan = req.plan || {};
    if (plan.meals && plan.meals.length) {
      setMealCount(plan.mealCount || plan.meals.length);
      const T = {calories:t.calories, protein:t.protein, carbs:t.carbs, fat:t.fat};
      const d = { meals: plan.meals.map(pm => {
        const hit = lib.filter(r => String(r.id) === String(pm.recipe_id))[0];
        // If the recipe has since been removed, keep the submitted macros so
        // the plan still shows and can still be assigned.
        const recipe = hit || {
          id: pm.recipe_id, name: pm.name, meal_type: pm.slot, source: pm.source,
          calories: pm.servings ? pm.calories/pm.servings : pm.calories,
          protein: pm.servings ? pm.protein/pm.servings : pm.protein,
          carbs: pm.servings ? pm.carbs/pm.servings : pm.carbs,
          fat: pm.servings ? pm.fat/pm.servings : pm.fat,
          fiber: 0, ingredients: [], instructions: []
        };
        return {slot: pm.slot, recipe, servings: pm.servings || 1,
                calories: pm.calories, protein: pm.protein, carbs: pm.carbs, fat: pm.fat, fiber: 0};
      }), adjustments: [] };
      MB.recomputeDay(d, T);
      setDay(d);
    }
    setConfirming(false);
  }

  async function declineRequest(req) {
    await sb.from('plan_requests').update({status:'declined', reviewed_at:new Date().toISOString()}).eq('id',req.id);
    loadRequests();
  }

  const clientName = (clients.filter(c=>c.id===selectedId)[0]||{}).name || '';

  async function assign() {
    const klein = method === 'klein';
    if (!selectedId || (!klein && !targets)) return;
    setBusy(true);
    const rows = [];
    if (klein) {
      if (kWeek) kWeek.forEach((d,i)=>{ MB.kleinDayToPlanRows(d, selectedId, i).forEach(r=>rows.push(r)); });
      else if (kDay) MB.kleinDayToPlanRows(kDay, selectedId, null).forEach(r=>rows.push(r));
    } else if (week) {
      week.forEach((d,i)=>{ MB.dayToPlanRows(d, selectedId, i).forEach(r=>rows.push(r)); });
    } else if (day) {
      MB.dayToPlanRows(day, selectedId, null).forEach(r=>rows.push(r));
    }
    if (!rows.length) { setBusy(false); return; }
    const isWeek = klein ? !!kWeek : !!week;

    // Replace whatever plan they are on, then write the new one.
    const del = await sb.from('meal_plans').delete().eq('user_id', selectedId);
    if (del.error) { setError('Could not clear the old plan: ' + del.error.message); setBusy(false); return; }

    let ins = await sb.from('meal_plans').insert(rows);
    if (ins.error) {
      // Migration not run yet: retry with only the original columns.
      const slim = rows.map(r=>({user_id:r.user_id, meal_time:r.meal_time, meal_name:r.meal_name,
        protein:r.protein, carbs:r.carbs, fat:r.fat, calories:r.calories}));
      ins = await sb.from('meal_plans').insert(slim);
      if (ins.error) { setError('Could not save the plan: ' + ins.error.message); setBusy(false); return; }
      setSaved('Plan assigned to ' + clientName + '. Heads up: the extra columns are missing, so servings and day-of-week were not stored. Run supabase-meal-engine.sql to keep them.');
    } else {
      setSaved((klein ? 'Klein Method plan' : 'Plan') + ' assigned to ' + clientName + '.' + (isWeek ? ' Seven days.' : ''));
    }

    if (klein) {
      // No macro targets on a Klein plan. Clear them so the client's Meals tab
      // does not measure portions against numbers he is not tracking.
      try {
        await sb.from('profiles').update({
          target_calories: null, target_protein: null, target_carbs: null, target_fat: null,
          macros_updated_at: new Date().toISOString()
        }).eq('id', selectedId);
      } catch (e) { /* pre-migration, skip */ }
      try {
        const p = (kDay || kWeek[0]).portions;
        await sb.from('messages').insert({
          sender_id: coachId, recipient_id: selectedId, from_coach: true,
          content: 'Your new plan is live, Klein Method style. Every main meal: ' + p.proteinOz + ' oz of lean protein and ' +
            p.carbOz + ' oz of carbs, both weighed cooked, plus all the vegetables you want. No macro math.' +
            (isWeek ? ' Seven days of meals, check the Meals tab each morning.' : ' Check the Meals tab.')
        });
      } catch (e) { /* message is a nicety, not the job */ }
    }

    // Save the targets on the profile and tell the client.
    if (!klein) try {
      await sb.from('profiles').update({
        sex, age: parseFloat(age) || null,
        height_in: (parseFloat(heightFt)||0)*12 + (parseFloat(heightIn)||0) || null,
        activity_factor: parseFloat(activity), goal, split_key: targets.split.key,
        split_protein_pct: targets.split.p, split_carbs_pct: targets.split.c, split_fat_pct: targets.split.f,
        meals_per_day: Number(mealCount),
        bmr_mifflin: targets.bmr.mifflin || null, bmr_harris: targets.bmr.harris || null,
        tdee_average: targets.tdee.average || null,
        target_calories: targets.calories, target_protein: targets.protein,
        target_carbs: targets.carbs, target_fat: targets.fat,
        macros_updated_at: new Date().toISOString()
      }).eq('id', selectedId);
    } catch (e) { /* pre-migration, skip */ }

    if (!klein) try {
      await sb.from('messages').insert({
        sender_id: coachId, recipient_id: selectedId, from_coach: true,
        content: 'Your new plan is live. ' + targets.calories + ' calories, ' +
          targets.protein + 'g protein, ' + targets.carbs + 'g carbs, ' + targets.fat + 'g fat.' +
          (week ? ' Seven days of meals, check the Meals tab each morning.' : ' Check the Meals tab.')
      });
    } catch (e) { /* message is a nicety, not the job */ }

    const pending = requests.filter(r=>r.user_id===selectedId);
    for (const r of pending) {
      await sb.from('plan_requests').update({status:'approved', reviewed_at:new Date().toISOString()}).eq('id', r.id);
    }
    loadRequests();
    setConfirming(false); setBusy(false);
  }

  const customSum = Number(cp)+Number(cc)+Number(cf);
  const kRows = d => d.meals.length + d.snacks.length + 1;
  const planRowCount = method === 'klein'
    ? (kWeek ? kWeek.reduce((n,d)=>n + kRows(d), 0) : kDay ? kRows(kDay) : 0)
    : (week ? week.reduce((n,d)=>n + d.meals.length + (d.adjustments||[]).length, 0)
            : day ? day.meals.length + (day.adjustments||[]).length : 0);
  const planIsWeek = method === 'klein' ? !!kWeek : !!week;
  const planReady = method === 'klein' ? !!(kDay || kWeek) : !!((day || week) && targets);

  return (
    <div>
      <div className="section-title">Plan Builder</div>
      <div className="section-sub">Macros and recipes, or Klein Method portions, then assign it</div>

      {requests.length > 0 && (
        <div className="panel">
          <div className="panel-title">Waiting on you — {requests.length} plan {requests.length===1?'request':'requests'}</div>
          {requests.map(req=>{
            const who = (clients.filter(c=>c.id===req.user_id)[0]||{}).name || req.user_id.slice(0,8);
            const t = req.targets||{}; const p = req.plan||{};
            return (
              <div key={req.id} className="req-card">
                <div className="req-head">
                  <div>
                    <div className="req-name">{who}</div>
                    <div className="req-meta">
                      {t.method === 'klein'
                        ? 'Klein Method · ' + Math.round(t.weightLbs) + ' lbs · ' + t.proteinOz + ' oz protein, ' + t.carbOz + ' oz carbs per meal'
                        : t.calories + ' cal · ' + t.protein + 'P / ' + t.carbs + 'C / ' + t.fat + 'F' + (t.split ? ' · ' + t.split.p + '/' + t.split.c + '/' + t.split.f : '')}
                      {' · '}{timeAgo(req.created_at)}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn-red" onClick={()=>loadRequest(req)}>Open in builder</button>
                    <button className="btn-grey" onClick={()=>declineRequest(req)}>Dismiss</button>
                  </div>
                </div>
                {p.meals && t.method !== 'klein' && (
                  <div className="req-body">
                    {p.meals.map(m=>m.name + (m.servings!==1?' ×'+m.servings:'')).join(' · ')}
                    {p.fit ? ' — fit: ' + p.fit : ''}
                  </div>
                )}
                {t.method === 'klein' && p.estimate && (
                  <div className="req-body">
                    Three main meals and {(p.snacks||[]).length} snacks. Rough estimate: {p.estimate.calories} cal, {p.estimate.protein}P / {p.estimate.carbs}C / {p.estimate.fat}F.
                  </div>
                )}
                {(t.flags||[]).filter(f=>f.level==='stop').map((f,i)=>(
                  <div key={i} className="flag stop"><div className="flag-title">{f.title}</div><div className="flag-body">{f.body}</div></div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      <div className="panel">
        <div className="panel-title">1. Client &amp; numbers</div>
        <div className="form-row">
          <div className="field">
            <label>Client</label>
            <select value={selectedId} onChange={e=>selectClient(e.target.value)}>
              <option value="">-- Choose a client --</option>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name||c.email}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Recipe library</label>
            <div style={{background:'#0f0f0f',border:'0.5px solid var(--border)',borderRadius:3,fontSize:13,color:'var(--grey)',padding:'10px 12px'}}>{libNote||'loading…'}</div>
          </div>
        </div>

        {selectedId && (
          <div className="field" style={{marginBottom:14}}>
            <label>Plan style</label>
            <div className="unit-toggle" style={{display:'inline-flex'}}>
              <button className={`unit-btn${method==='recipes'?' active':''}`} onClick={()=>switchMethod('recipes')}>Cookbook recipes + macros</button>
              <button className={`unit-btn${method==='klein'?' active':''}`} onClick={()=>switchMethod('klein')}>Klein Method · whole foods</button>
            </div>
          </div>
        )}

        {selectedId && method === 'klein' && (
          <div>
            <div className="form-row three">
              <div className="field"><label>Bodyweight (lbs)</label><input type="number" value={weight} onChange={e=>{setWeight(e.target.value); setKDay(null); setKWeek(null);}}/></div>
              <div className="field">
                <label>Portions</label>
                <select value={kGoal} onChange={e=>{setKGoal(e.target.value); setKDay(null); setKWeek(null);}}>
                  {MB.KLEIN_GOALS.map(g=><option key={g.key} value={g.key}>{g.label} — {g.hint}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Snacks between meals</label>
                <select value={kSnacks} onChange={e=>{setKSnacks(Number(e.target.value)); setKDay(null); setKWeek(null);}}>
                  <option value="2">2 — eats 5 times a day</option>
                  <option value="3">3 — eats 6 times a day</option>
                  <option value="4">4 — eats 7 times a day</option>
                </select>
              </div>
            </div>
            <div className="field" style={{marginBottom:12}}>
              <label>Foods in the rotation — click off anything he won't eat</label>
              <div className="chip-row">
                {MB.KLEIN_PROTEINS.concat(MB.KLEIN_CARBS).map(f=>(
                  <button key={f.key} className={`food-chip${kOff[f.key]?' off':''}`}
                    onClick={()=>{ setKOff(o=>({...o,[f.key]:!o[f.key]})); setKDay(null); setKWeek(null); }}>{f.name}</button>
                ))}
              </div>
            </div>
            {kPortions.ok && (
              <div className="tot-grid" style={{marginTop:0}}>
                <div className="tot-cell"><div className="tot-label">Protein / main meal</div><div className="tot-val">{kPortions.proteinOz} oz</div><div className="tot-gap on">weighed cooked</div></div>
                <div className="tot-cell"><div className="tot-label">Carbs / main meal</div><div className="tot-val">{kPortions.carbOz} oz</div><div className="tot-gap on">range {kPortions.carbRange[0]} to {kPortions.carbRange[1]} oz</div></div>
                <div className="tot-cell"><div className="tot-label">Vegetables / meal</div><div className="tot-val" style={{fontSize:15,lineHeight:1.5}}>{kPortions.vegText}</div><div className="tot-gap on">not weighed</div></div>
                <div className="tot-cell"><div className="tot-label">Healthy fats / day</div><div className="tot-val">{kPortions.fatServings}</div><div className="tot-gap on">servings, {kPortions.bandLabel}</div></div>
              </div>
            )}
            {kPortions.ok && kPortions.belowTable && (
              <div className="flag note"><div className="flag-title">Under the chart</div>
                <div className="flag-body">The Klein portion chart starts at 150 lbs. These are its smallest portions. Trim them by hand if he needs less.</div></div>
            )}
            <div className="btn-row">
              <button className="btn-red" onClick={()=>buildKlein('day', seed)} disabled={!kPortions.ok}>Build One Day</button>
              <button className="btn-grey" onClick={()=>buildKlein('week', seed)} disabled={!kPortions.ok}>Build Seven Days</button>
            </div>
            {!kPortions.ok && <div className="pb-note">Enter his bodyweight to get portions.</div>}
            {error && <div className="error-msg" style={{textAlign:'left',marginTop:10}}>{error}</div>}
          </div>
        )}

        {selectedId && method === 'recipes' && (
          <div>
            <div className="pb-row">
              <div className="field">
                <label>Sex</label>
                <select value={sex} onChange={e=>setSex(e.target.value)}>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>
              <div className="field"><label>Age</label><input type="number" value={age} onChange={e=>setAge(e.target.value)}/></div>
              <div className="field"><label>Weight (lbs)</label><input type="number" value={weight} onChange={e=>setWeight(e.target.value)}/></div>
              <div className="field">
                <label>Height</label>
                <div style={{display:'flex',gap:6}}>
                  <input type="number" placeholder="ft" value={heightFt} onChange={e=>setHeightFt(e.target.value)}/>
                  <input type="number" placeholder="in" value={heightIn} onChange={e=>setHeightIn(e.target.value)}/>
                </div>
              </div>
            </div>
            <div className="pb-row-2">
              <div className="field">
                <label>Activity</label>
                <select value={activity} onChange={e=>setActivity(e.target.value)}>
                  {MB.ACTIVITY.map(a=><option key={a.key} value={a.value}>{a.label} — {a.hint}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Goal</label>
                <select value={goal} onChange={e=>setGoal(e.target.value)}>
                  {MB.GOALS.map(g=><option key={g.key} value={g.key}>{g.label} — {g.hint}</option>)}
                </select>
              </div>
            </div>
            <div className="field" style={{marginBottom:12}}>
              <label>Macro split</label>
              <div className="split-grid">
                {MB.SPLITS.map(sp=>(
                  <button key={sp.key} className={`split-btn${splitKey===sp.key?' active':''}`} onClick={()=>setSplitKey(sp.key)}>
                    <span className="split-nums">{sp.key==='custom'?'Custom':`${Math.round(sp.p*100)}/${Math.round(sp.c*100)}/${Math.round(sp.f*100)}`}</span>
                    <span className="split-name">{sp.key==='custom'?'Special cases':sp.label}</span>
                  </button>
                ))}
              </div>
              <div className="split-hint">{MB.splitByKey(splitKey).hint}</div>
            </div>
            {splitKey === 'custom' && (
              <div className="form-row three">
                <div className="field"><label>Protein %</label><input type="number" value={cp} onChange={e=>setCp(e.target.value)}/></div>
                <div className="field"><label>Carbs %</label><input type="number" value={cc} onChange={e=>setCc(e.target.value)}/></div>
                <div className="field"><label>Fat % {customSum!==100 ? '(adds to '+customSum+'%)' : ''}</label><input type="number" value={cf} onChange={e=>setCf(e.target.value)}/></div>
              </div>
            )}
            <div className="form-row">
              <div className="field">
                <label>Meals per day</label>
                <select value={mealCount} onChange={e=>{setMealCount(e.target.value); setDay(null); setWeek(null);}}>
                  <option value="3">3 — breakfast, lunch, dinner</option>
                  <option value="4">4 — plus one snack</option>
                  <option value="5">5 — plus two snacks</option>
                  <option value="6">6 — plus three snacks</option>
                </select>
              </div>
            </div>
            <div className="btn-row">
              <button className="btn-red" onClick={runNumbers}>Run Numbers</button>
            </div>
            {error && <div className="error-msg" style={{textAlign:'left',marginTop:10}}>{error}</div>}
          </div>
        )}
      </div>

      {method === 'klein' && (kDay || kWeek) && (
        <div className="panel">
          <div className="panel-title">How it stacks up — your eyes only</div>
          {kEstCal > 0 && kEstCal < 1500 && (
            <div className="flag stop" style={{marginTop:0,marginBottom:8}}>
              <div className="flag-title">About {kEstCal} calories a day is thin, even for a cut</div>
              <div className="flag-body">The lighter proteins (egg whites, shrimp, white fish) pull the day down. Add a snack or two, move portions to Fuller, or swap in chicken or turkey.</div>
            </div>
          )}
          {kUnderPct === null ? (
            <div className="pb-note" style={{marginTop:0}}>
              Rough estimate: about {kEstCal} calories a day. Run his numbers once under Cookbook recipes and this will show how that compares to his maintenance.
            </div>
          ) : (
            <div className={`flag ${kUnderPct > 25 ? 'warn' : 'note'}`} style={{marginTop:0}}>
              <div className="flag-title">
                About {kEstCal} cal a day against a maintenance near {kMaint}: {kUnderPct > 0 ? kUnderPct + '% under' : Math.abs(kUnderPct) + '% over'}
              </div>
              <div className="flag-body">
                {kUnderPct > 25
                  ? 'That is a hard cut for him. Klein portions are set by bodyweight, not activity, so a big or active man lands well under. Add snacks (each is roughly 130 calories of lean protein) or move portions to Fuller.'
                  : kUnderPct > 5
                    ? 'A workable deficit. He should lean out steadily on this.'
                    : 'Close to maintenance. Fine for holding, slow for fat loss.'}
              </div>
            </div>
          )}
        </div>
      )}

      {method === 'klein' && kDay && (
        <div className="panel">
          <div className="panel-title">2. The plan — swap anything before it goes out</div>
          <KleinDayEditor day={kDay} label="Daily template" onChange={setKDay} onShuffle={()=>buildKlein('day', seed+1)}/>
        </div>
      )}

      {method === 'klein' && kWeek && (
        <div className="panel">
          <div className="panel-title">2. The week — swap anything before it goes out</div>
          {kWeek.map((d,i)=>(
            <KleinDayEditor key={i} day={d}
              label={['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}
              onChange={nd=>{ const w = kWeek.slice(); w[i] = nd; setKWeek(w); }}/>
          ))}
        </div>
      )}

      {method === 'recipes' && targets && (
        <div className="panel">
          <div className="panel-title">2. Targets</div>
          <div className="bp-hero">
            <div className="bp-hero-num">{targets.calories}</div>
            <div className="bp-hero-label">calories / day{targets.input.goalLabel ? ' — ' + targets.input.goalLabel : ''}</div>
          </div>
          <div className="macro-grid">
            <div className="macro-card">
              <div className="macro-num">{targets.protein}<span>g</span></div>
              <div className="macro-label">Protein {targets.split.p}%</div>
              <div className="macro-sub">{targets.perLb.protein ? targets.perLb.protein + ' g / lb' : ''}</div>
            </div>
            <div className="macro-card">
              <div className="macro-num">{targets.carbs}<span>g</span></div>
              <div className="macro-label">Carbs {targets.split.c}%</div>
              <div className="macro-sub">{targets.perLb.carbs ? targets.perLb.carbs + ' g / lb' : ''}</div>
            </div>
            <div className="macro-card">
              <div className="macro-num">{targets.fat}<span>g</span></div>
              <div className="macro-label">Fat {targets.split.f}%</div>
              <div className="macro-sub">{targets.perLb.fat ? targets.perLb.fat + ' g / lb' : ''}</div>
            </div>
          </div>
          {targets.bmr.mifflin && (
            <div className="formula-grid">
              <div className="formula-cell"><span>Mifflin BMR</span><b>{targets.bmr.mifflin}</b></div>
              <div className="formula-cell"><span>Harris BMR</span><b>{targets.bmr.harris}</b></div>
              <div className="formula-cell"><span>Average BMR</span><b>{targets.bmr.average}</b></div>
              <div className="formula-cell"><span>Maintenance</span><b>{targets.tdee.average}</b></div>
            </div>
          )}
          {targets.flags.map((f,i)=>(
            <div key={i} className={`flag ${f.level}`}>
              <div className="flag-title">{f.title}</div>
              <div className="flag-body">{f.body}</div>
            </div>
          ))}
          <div className="btn-row">
            <button className="btn-red" onClick={()=>buildOne(seed)} disabled={busy}>{busy?'Working…':'Build One Day'}</button>
            <button className="btn-grey" onClick={()=>buildWeek(seed)} disabled={busy}>{busy?'Working…':'Build Seven Days'}</button>
          </div>
        </div>
      )}

      {method === 'recipes' && day && targets && (
        <div className="panel">
          <div className="panel-title">3. The plan — edit anything before it goes out</div>
          <DayEditor day={day} targets={targetObj(targets)} lib={lib} label="Daily template"
            onChange={setDay} onShuffle={()=>buildOne(seed+1)}/>
        </div>
      )}

      {method === 'recipes' && week && targets && (
        <div className="panel">
          <div className="panel-title">3. The week — edit anything before it goes out</div>
          {week.map((d,i)=>(
            <DayEditor key={i} day={d} targets={targetObj(targets)} lib={lib}
              label={['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}
              onChange={nd=>{ const w = week.slice(); w[i] = nd; setWeek(w); }}/>
          ))}
        </div>
      )}

      {planReady && selectedId && (
        <div className="panel">
          <div className="panel-title">{method === 'klein' ? '3' : '4'}. Assign</div>
          {!confirming && (
            <div className="btn-row">
              <button className="btn-green" onClick={()=>setConfirming(true)} disabled={busy}>
                Assign to {clientName}
              </button>
            </div>
          )}
          {confirming && (
            <div className="confirm-bar">
              <div className="confirm-text">
                This wipes every meal row {clientName} currently has and replaces it with {planRowCount} new {planRowCount===1?'row':'rows'}
                {planIsWeek ? ' across seven days' : ''}. Their old plan is not recoverable.
              </div>
              <div className="btn-row" style={{marginTop:0}}>
                <button className="btn-green" onClick={assign} disabled={busy}>{busy?'Saving…':'Yes, replace the plan'}</button>
                <button className="btn-grey" onClick={()=>setConfirming(false)}>Cancel</button>
              </div>
            </div>
          )}
          {saved && <div className="success-msg">{saved}</div>}
        </div>
      )}
    </div>
  );
}

/* ===================== Recipe Library (paste a cookbook in, no code) ======= */

function recipeToRow(r) {
  return {
    name: r.name, meal_type: r.meal_type, source: r.source || null,
    serves: r.serves || 1, serving_label: r.serving_label || null,
    prep: r.prep || null, cook: r.cook || null, total_time: r.total_time || null,
    calories: r.calories, protein: r.protein, carbs: r.carbs, fat: r.fat,
    fiber: r.fiber == null ? null : r.fiber,
    ingredients: r.ingredients || [], instructions: r.instructions || [],
    tip: r.tip || null, note: r.note || null, tags: r.tags || [], active: r.active !== false
  };
}

function RecipesTab() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tableOk, setTableOk] = useState(true);
  const [status, setStatus] = useState('');
  const [isErr, setIsErr] = useState(false);
  const [busy, setBusy] = useState(false);

  const [filterType, setFilterType] = useState('');
  const [filterSource, setFilterSource] = useState('');
  const [editId, setEditId] = useState(null);
  const [edit, setEdit] = useState({});

  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState('');
  const [pasteSource, setPasteSource] = useState('');
  const [pasteType, setPasteType] = useState('dinner');
  const [preview, setPreview] = useState(null);
  const [warnings, setWarnings] = useState([]);

  useEffect(()=>{ load(); },[]);

  function note(msg, err) { setStatus(msg); setIsErr(!!err); }

  async function load() {
    setLoading(true);
    const { data, error } = await sb.from('recipes').select('*').order('source').order('meal_type').order('name');
    if (error) { setTableOk(false); setRows([]); }
    else { setTableOk(true); setRows((data||[]).map(MB.normalizeRow)); }
    setLoading(false);
  }

  const keyOf = r => (r.name||'').trim().toLowerCase() + '|' + (r.source||'').trim().toLowerCase();

  function parsePaste() {
    const res = MB.parseRecipes(pasteText, {source: pasteSource.trim() || null, meal_type: pasteType});
    setWarnings(res.warnings);
    setPreview(res.recipes.map(r=>Object.assign({}, r, {keep: true})));
    if (!res.recipes.length) note('Nothing usable in that paste. See the format guide above.', true);
    else note('Found ' + res.recipes.length + ' ' + (res.recipes.length===1?'recipe':'recipes') + '. Check them over, then save.');
  }

  function updatePreview(i, field, val) {
    setPreview(p=>p.map((r,idx)=>idx===i ? Object.assign({}, r, {[field]: val}) : r));
  }

  async function savePreview() {
    if (!pasteSource.trim()) { note('Give the cookbook a name first, so the recipes stay grouped.', true); return; }
    setBusy(true);
    const have = {}; rows.forEach(r=>{ have[keyOf(r)] = 1; });
    const picked = preview.filter(r=>r.keep).map(r=>Object.assign({}, r, {
      source: pasteSource.trim(),
      calories: Number(r.calories), protein: Number(r.protein), carbs: Number(r.carbs), fat: Number(r.fat)
    }));
    const fresh = picked.filter(r=>!have[keyOf(r)]);
    const dupes = picked.length - fresh.length;
    if (!fresh.length) { note('All ' + picked.length + ' are already in the library.', true); setBusy(false); return; }
    const { error } = await sb.from('recipes').insert(fresh.map(recipeToRow));
    if (error) { note('Save failed: ' + error.message, true); setBusy(false); return; }
    note('Saved ' + fresh.length + ' ' + (fresh.length===1?'recipe':'recipes') + (dupes ? ' (' + dupes + ' already existed and were skipped).' : '.'));
    setPreview(null); setPasteText(''); setWarnings([]); setBusy(false); load();
  }

  async function toggleActive(r) {
    await sb.from('recipes').update({active: !r.active}).eq('id', r.id);
    load();
  }

  function startEdit(r) {
    setEditId(r.id);
    setEdit({name:r.name, meal_type:r.meal_type, calories:r.calories, protein:r.protein, carbs:r.carbs, fat:r.fat});
  }

  async function saveEdit() {
    const payload = {
      name: String(edit.name||'').trim(), meal_type: edit.meal_type,
      calories: Number(edit.calories), protein: Number(edit.protein),
      carbs: Number(edit.carbs), fat: Number(edit.fat)
    };
    if (!payload.name || !(payload.calories > 0)) { note('A recipe needs a name and calories above zero.', true); return; }
    const { error } = await sb.from('recipes').update(payload).eq('id', editId);
    if (error) note('Could not save: ' + error.message, true); else note('Saved.');
    setEditId(null); load();
  }

  const sources = Array.from(new Set(rows.map(r=>r.source).filter(Boolean)));
  const shown = rows.filter(r=>(!filterType || r.meal_type===filterType) && (!filterSource || r.source===filterSource));
  const counts = {}; rows.filter(r=>r.active).forEach(r=>{ counts[r.meal_type] = (counts[r.meal_type]||0)+1; });

  return (
    <div>
      <div className="section-title">Recipe Library</div>
      <div className="section-sub">What the plan builder is allowed to pick from</div>

      {!loading && !tableOk && (
        <div className="panel">
          <div className="flag warn">
            <div className="flag-title">The recipes table is not set up yet</div>
            <div className="flag-body">
              The plan builder has nothing to build from until it is. Run <b>supabase-meal-engine.sql</b> once in your
              Supabase SQL editor, then run your private <b>recipes-seed.sql</b> backup the same way to load both
              cookbooks, and reload this page.
            </div>
          </div>
        </div>
      )}

      {tableOk && (
        <div className="panel">
          <div className="panel-title">Library — {rows.filter(r=>r.active).length} active recipes</div>
          <div className="tot-grid" style={{marginTop:0,marginBottom:14}}>
            {['breakfast','lunch','dinner','snacks'].map(t=>(
              <div key={t} className="tot-cell">
                <div className="tot-label">{t}</div>
                <div className="tot-val">{counts[t]||0}</div>
              </div>
            ))}
          </div>

          {!loading && rows.length === 0 && (
            <div className="flag warn" style={{marginBottom:12}}>
              <div className="flag-title">The library is empty</div>
              <div className="flag-body">
                The plan builder has nothing to pick from. Run your private <b>recipes-seed.sql</b> backup in the Supabase
                SQL editor to load both cookbooks, or use Add recipes below to paste them in.
              </div>
            </div>
          )}

          <div className="rec-toolbar">
            <div className="field" style={{minWidth:150}}>
              <label>Meal</label>
              <select value={filterType} onChange={e=>setFilterType(e.target.value)}>
                <option value="">All meals</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snacks">Snacks</option>
              </select>
            </div>
            <div className="field" style={{minWidth:190}}>
              <label>Cookbook</label>
              <select value={filterSource} onChange={e=>setFilterSource(e.target.value)}>
                <option value="">All cookbooks</option>
                {sources.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <button className="btn-grey" onClick={()=>setPasteOpen(!pasteOpen)}>
              <i className="ti ti-plus"/> {pasteOpen ? 'Close importer' : 'Add recipes'}
            </button>
          </div>

          <div className={`ce-status${isErr?' err':''}`}>{status}</div>

          {pasteOpen && (
            <div style={{marginBottom:16}}>
              <div className="paste-help">
                <p>Paste straight out of the manuscript, one recipe or a whole chapter. Both of your book layouts are read automatically.
                   For anything typed by hand, this is all a recipe needs:</p>
                <pre>{`Blackened Chicken Rice Bowl
Type: lunch
Serves: 2
Calories: 480
Protein: 46g
Carbs: 44g
Fat: 12g

Ingredients
- 12 oz chicken breast
- 2 cups cooked jasmine rice

Instructions
1. Season and sear the chicken.
2. Slice and serve over rice.
---
Next Recipe Name
...`}</pre>
                <p style={{marginBottom:0}}>Macros are per serving. Separate hand-typed recipes with a line of three dashes.</p>
              </div>
              <div className="form-row">
                <div className="field">
                  <label>Cookbook name</label>
                  <input placeholder="e.g. The Long Game" value={pasteSource} onChange={e=>setPasteSource(e.target.value)}/>
                </div>
                <div className="field">
                  <label>Meal type, if the paste does not say</label>
                  <select value={pasteType} onChange={e=>setPasteType(e.target.value)}>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snacks">Snacks</option>
                  </select>
                </div>
              </div>
              <textarea className="paste-area" placeholder="Paste recipes here…" value={pasteText}
                onChange={e=>{ setPasteText(e.target.value); setPreview(null); }}/>
              <div className="btn-row">
                <button className="btn-red" onClick={parsePaste} disabled={!pasteText.trim()}>Read recipes</button>
              </div>

              {warnings.map((w,i)=><div key={i} className="rec-warn" style={{marginTop:8}}>{w}</div>)}

              {preview && preview.length > 0 && (
                <div className="import-preview">
                  <div className="rec-row rec-row-head">
                    <span>Recipe</span><span>Meal</span><span style={{textAlign:'right'}}>Cal</span>
                    <span style={{textAlign:'right'}}>P</span><span style={{textAlign:'right'}}>C</span>
                    <span style={{textAlign:'right'}}>F</span><span style={{textAlign:'right'}}>Keep</span>
                  </div>
                  {preview.map((r,i)=>{
                    const chk = MB.macroCheck({calories:Number(r.calories), protein:Number(r.protein), carbs:Number(r.carbs), fat:Number(r.fat)});
                    return (
                      <div key={i} className="rec-row">
                        <div>
                          <div className="rec-name">{r.name}</div>
                          <div className="rec-src">{r.ingredients.length} ingredients · {r.instructions.length} steps</div>
                          {!chk.ok && <div className="rec-warn">{chk.note}</div>}
                        </div>
                        <select className="rec-type" style={{border:'none'}} value={r.meal_type} onChange={e=>updatePreview(i,'meal_type',e.target.value)}>
                          <option value="breakfast">breakfast</option>
                          <option value="lunch">lunch</option>
                          <option value="dinner">dinner</option>
                          <option value="snacks">snacks</option>
                        </select>
                        <div className="rec-num">{r.calories}</div>
                        <div className="rec-num">{r.protein}</div>
                        <div className="rec-num">{r.carbs}</div>
                        <div className="rec-num">{r.fat}</div>
                        <div style={{textAlign:'right'}}>
                          <input type="checkbox" checked={r.keep} onChange={e=>updatePreview(i,'keep',e.target.checked)}
                            style={{accentColor:'var(--red)',width:16,height:16}}/>
                        </div>
                      </div>
                    );
                  })}
                  <div className="btn-row">
                    <button className="btn-green" onClick={savePreview} disabled={busy}>
                      {busy ? 'Saving…' : 'Save ' + preview.filter(r=>r.keep).length + ' to the library'}
                    </button>
                    <button className="btn-grey" onClick={()=>{ setPreview(null); setWarnings([]); }}>Discard</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {loading && <div className="loading">Loading recipes...</div>}
          {!loading && rows.length > 0 && (
            <div>
              <div className="rec-row rec-row-head">
                <span>Recipe</span><span>Meal</span><span style={{textAlign:'right'}}>Cal</span>
                <span style={{textAlign:'right'}}>P</span><span style={{textAlign:'right'}}>C</span>
                <span style={{textAlign:'right'}}>F</span><span></span>
              </div>
              {shown.map(r=> editId === r.id ? (
                <div key={r.id} className="rec-row" style={{gridTemplateColumns:'1fr 92px 58px 54px 54px 54px 110px'}}>
                  <input className="rec-edit" value={edit.name} onChange={e=>setEdit({...edit,name:e.target.value})}/>
                  <select className="rec-edit" value={edit.meal_type} onChange={e=>setEdit({...edit,meal_type:e.target.value})}>
                    <option value="breakfast">breakfast</option><option value="lunch">lunch</option>
                    <option value="dinner">dinner</option><option value="snacks">snacks</option>
                  </select>
                  <input className="rec-edit" type="number" value={edit.calories} onChange={e=>setEdit({...edit,calories:e.target.value})}/>
                  <input className="rec-edit" type="number" value={edit.protein} onChange={e=>setEdit({...edit,protein:e.target.value})}/>
                  <input className="rec-edit" type="number" value={edit.carbs} onChange={e=>setEdit({...edit,carbs:e.target.value})}/>
                  <input className="rec-edit" type="number" value={edit.fat} onChange={e=>setEdit({...edit,fat:e.target.value})}/>
                  <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                    <button className="ce-copy" onClick={saveEdit}>Save</button>
                    <button className="ce-copy" onClick={()=>setEditId(null)}>Cancel</button>
                  </div>
                </div>
              ) : (
                <div key={r.id} className="rec-row" style={{opacity: r.active ? 1 : 0.45}}>
                  <div>
                    <div className="rec-name">{r.name}</div>
                    <div className="rec-src">{r.source || 'No cookbook'}{(r.tags||[]).filter(t=>/\d+\/\d+\/\d+/.test(t)).map(t=>' · built for ' + t)}{!r.active ? ' · turned off' : ''}</div>
                  </div>
                  <div className="rec-type">{r.meal_type}</div>
                  <div className="rec-num">{r.calories}</div>
                  <div className="rec-num">{r.protein}</div>
                  <div className="rec-num">{r.carbs}</div>
                  <div className="rec-num">{r.fat}</div>
                  <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                    <button className="ce-copy" onClick={()=>startEdit(r)}>Edit</button>
                    <button className="ce-copy" onClick={()=>toggleActive(r)}>{r.active ? 'Off' : 'On'}</button>
                  </div>
                </div>
              ))}
              {shown.length === 0 && <div className="empty">Nothing matches that filter.</div>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [tab, setTab] = useState('clients');

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user?.email === COACH_EMAIL) setSession(session);
      setAuthLoading(false);
    });
    sb.auth.onAuthStateChange((_,session)=>{
      if (session?.user?.email === COACH_EMAIL) setSession(session);
      else { setSession(null); setAuthLoading(false); }
    });
  },[]);

  async function handleLogout() {
    await sb.auth.signOut();
    setSession(null);
  }

  if (authLoading) return <div className="loading" style={{paddingTop:80}}>Loading...</div>;
  if (!session) return <LoginScreen/>;

  const tabs = [
    {key:'clients',label:'Clients'},
    {key:'builder',label:'Plan Builder'},
    {key:'meals',label:'Meal Plans'},
    {key:'recipes',label:'Recipes'},
    {key:'messages',label:'Messages'},
    {key:'checkins',label:'Check-ins'},
    {key:'measurements',label:'Measurements'},
    {key:'photos',label:'Photos'},
    {key:'content',label:'Content Engine'},
  ];

  return (
    <div style={{background:'var(--black)',minHeight:'100vh'}}>
      <div className="top-nav">
        <div className="nav-logo">MB<span>.</span> <span style={{fontSize:14,color:'var(--grey)',fontFamily:'Barlow Condensed',letterSpacing:2}}>COACH</span></div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div className="nav-badge">Coach</div>
          <button className="logout-btn" onClick={handleLogout}>Sign Out</button>
        </div>
      </div>
      <div className="tab-bar">
        {tabs.map(t=>(
          <button key={t.key} className={`tab-btn${tab===t.key?' active':''}`} onClick={()=>setTab(t.key)}>{t.label}</button>
        ))}
      </div>
      <div className="main">
        {tab==='clients' && <ClientsTab coachId={session.user.id}/>}
        {tab==='builder' && <PlanBuilderTab coachId={session.user.id}/>}
        {tab==='meals' && <MealsTab coachId={session.user.id}/>}
        {tab==='recipes' && <RecipesTab/>}
        {tab==='messages' && <MessagesTab coachId={session.user.id}/>}
        {tab==='checkins' && <CheckinsTab/>}
        {tab==='measurements' && <MeasurementsTab/>}
        {tab==='photos' && <PhotosTab/>}
        {tab==='content' && <ContentTab/>}
      </div>
    </div>
  );
}

const styleEl = document.createElement('style');
styleEl.textContent = styles;
document.head.appendChild(styleEl);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
